  details.how { margin-top: 6px; } details.how > summary { font-size: 14px; font-weight: 600; color: var(--soft); cursor: pointer; margin: 10px 0 14px; }

  .strip { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 0 0 6px; }

  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }

  .chip.on { color: var(--accent); border-color: var(--accent); }
  .empty { text-align: center; color: var(--muted); padding: 34px 16px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .tile b { display: block; font-size: 22px; line-height: 1.2; } .tile span { font-size: 12px; color: var(--muted); }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
  .grid2 > div { background: var(--raised); border-radius: 10px; padding: 12px 14px; font-size: 14px; }
  .grid2 b { display: block; margin-bottom: 4px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; } .tags span { background: var(--surface); border: 1px solid var(--line); border-radius: 99px; padding: 2px 10px; font-size: 12.5px; }
  .sigrow { padding: 12px 0; border-top: 1px solid var(--line); } .sigrow:first-of-type { border-top: 0; padding-top: 0; }
  .sigrow .why-t { color: var(--muted); font-size: 13px; }
  .bar { height: 6px; border-radius: 99px; background: var(--line); margin: 7px 0; overflow: hidden; } .bar i { display: block; height: 100%; background: var(--accent); }
  .tiers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .tiers div { background: var(--raised); border-radius: 10px; padding: 12px; text-align: center; font-size: 13px; }
  .tiers b { display: block; font-size: 21px; }
  .skel { display: grid; gap: 10px; } .skel i { display: block; height: 14px; border-radius: 6px; background: linear-gradient(90deg, var(--raised), var(--line), var(--raised)); background-size: 200% 100%; animation: sh 1.3s linear infinite; }
  @keyframes sh { to { background-position: -200% 0; } }
  @media (prefers-reduced-motion: reduce) { .skel i { animation: none; } }

  .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 60; max-width: min(92vw, 520px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; box-shadow: var(--shadow); }
  .err { color: var(--bad); }

  @media (max-width: 600px) {
    main { padding-top: 18px; }
    .card { padding: 16px; }

    .tiers { grid-template-columns: 1fr; }
    .sigs li { grid-template-columns: 46px minmax(0, 1fr); } .sigs .when { grid-column: 2; margin-top: -4px; }
    .person { flex-direction: column; gap: 8px; } .person .pact { align-self: flex-start; }

  }
</style>

<script>
const BASE = "https://tecgblsoylrshcqneevf.supabase.co/functions/v1";
const KEY = "sb_publishable_V2QMkeCD8XuuoGkz_sVT5Q_4klZp394";
let adminKey = ""; try { adminKey = localStorage.getItem("cp_admin") || ""; } catch {}

/* ============ helpers ============ */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

async function api(fn, body) {
  const res = await fetch(`${BASE}/${fn}`, {
    method: "POST",
    headers: { "Content-Type": "application/json", apikey: KEY, Authorization: `Bearer ${KEY}`, ...(adminKey ? { "x-admin-key": adminKey } : {}) },
    body: JSON.stringify(body),
  });
  const d = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(d.error || `Request failed (${res.status})`);
  return d;
}

let toastTimer;
function say(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), 4200); }

const days = (iso) => { const t = Date.parse(iso); return Number.isNaN(t) ? null : Math.floor((Date.now() - t) / 864e5); };
function ago(iso) {
  const t = Date.parse(iso); if (!t) return "";
  const h = (Date.now() - t) / 36e5;
  if (h < 1) return "just now"; if (h < 24) return `${Math.floor(h)}h ago`;
  const d = Math.floor(h / 24); return d === 1 ? "yesterday" : `${d} days ago`;
}
const day = (iso) => new Date(iso).toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" });
const scoreColor = (n) => (n >= 70 ? "var(--good)" : n >= 40 ? "var(--warn)" : "var(--bad)");
const money = (n) => (n >= 1e9 ? `$${(n / 1e9).toFixed(1)}B` : n >= 1e6 ? `$${Math.round(n / 1e6)}M` : `$${Math.round(n / 1e3)}K`);
const firmoText = (a) => !a?.firmo_at ? "" : [a.employee_band ? `${a.employee_band} people` : a.employees ? `${a.employees} people` : null, a.stage && !/^(other|unknown|undisclosed)$/i.test(a.stage) ? a.stage : null, a.raised_usd ? `${money(a.raised_usd)} raised` : null, a.hq_city || a.country].filter(Boolean).join(" · ");
const TIERS = { tier_1: ["Tier 1", "t1"], tier_2: ["Tier 2", "t2"], tier_3: ["Tier 3", "t3"] };
const tierHtml = (t) => (TIERS[t] ? `<span class="tier ${TIERS[t][1]}">${TIERS[t][0]}</span>` : "");
const FIT = { matches: ["Fits", "good"], close: ["Partly fits", "warn"], unknown: ["Fit unknown", ""], outside: ["Outside range", "bad"] };
const fitLine = (state, firmo) => { const f = FIT[state] || FIT.unknown; return `<div class="fit"><b class="${f[1]}">${f[0]}</b>${firmo ? ` · ${esc(firmo)}` : state === "unknown" ? " · size and stage not checked yet" : ""}</div>`; };
const HEAT = { hot: "Hot", warm: "Warm", watching: "Watching" }, HEAT_RANK = { hot: 0, warm: 1, watching: 2 };
const skeleton = (n = 3) => `<div class="card"><div class="skel">${"<i></i>".repeat(n)}</div></div>`;
const bullets = (a) => (a?.length ? `<ul class="plain">${a.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>` : `<p class="meta">Nothing found.</p>`);

/* ============ signals: a short, tidy list ============ */
function sigRow(s, hidden = false) {
  const summary = /\d+ open roles/.test(s.title);
  const k = s.kind === "hn" ? ["HN", "hn"] : s.kind === "news" ? ["News", "news"] : ["Hiring", "hiring"];
  let text = s.title.replace(/^Hiring:\s*/i, "").replace(/^Hacker News:\s*/i, "").trim();
  if (summary) text = `Currently ${text}`;
  const stamp = s.published || s.first_seen, days = (Date.now() - Date.parse(stamp)) / 864e5;
  const when = summary ? "" : ago(stamp);
  const fresh = !summary && !Number.isNaN(days) && (days < 14 ? " fresh" : days <= 30 ? " mid" : " old");
  const body = s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(text)}</a>` : esc(text);
  return `<li${hidden ? " hidden data-more" : ""}><span class="k ${k[1]}">${k[0]}</span><span class="t" title="${esc(s.title)}">${body}</span><span class="when${fresh || ""}">${esc(when)}</span></li>`;
}
function sigList(signals, max = 3) {
  const sorted = [...(signals || [])].sort((a, b) => (/\d+ open roles/.test(a.title) ? 1 : 0) - (/\d+ open roles/.test(b.title) ? 1 : 0));
  if (!sorted.length) return "";
  const head = sorted.slice(0, max).map((x) => sigRow(x)).join(""), rest = sorted.slice(max).map((x) => sigRow(x, true)).join("");
  return `<ul class="sigs">${head}${rest}</ul>${rest ? `<button class="btn link sm sigs-more" data-more-toggle>Show ${sorted.length - max} more signal${sorted.length - max > 1 ? "s" : ""}</button>` : ""}`;
}
const newCount = (signals) => (signals || []).filter((s) => s.is_new && !(s.kind === "hiring" && /\d+ open roles/.test(s.title))).length;

/* ============ owner mode ============ */
function drawMode(admin, credits) {
  const el = $("mode");
  el.className = `mode${admin ? " owner" : ""}`;
  el.innerHTML = admin
    ? `<span class="dot"></span>Owner${credits ? ` · ${credits.remaining} of ${credits.available} credits left` : ""}<button class="btn ghost sm" id="lock">Lock</button>`
    : `<span class="dot"></span>Demo mode<button class="btn ghost sm" id="unlock">Unlock</button>`;
  if (admin) $("lock").onclick = () => { adminKey = ""; try { localStorage.removeItem("cp_admin"); } catch {} refreshMode(); reloadVisible(); };
  else $("unlock").onclick = () => {
    el.innerHTML = `<span class="dot"></span><input id="keyin" type="password" placeholder="Owner key" aria-label="Owner key" autocomplete="off"><button class="btn ghost sm" id="keyno">Cancel</button>`;
    $("keyin").focus();
    $("keyno").onclick = () => drawMode(false);
    $("keyin").onkeydown = (e) => {
      if (e.key !== "Enter") return;
      adminKey = e.target.value.trim(); try { localStorage.setItem("cp_admin", adminKey); } catch {}
      refreshMode().then((ok) => { if (!ok) { adminKey = ""; try { localStorage.removeItem("cp_admin"); } catch {} say("That key was not accepted."); } else reloadVisible(); });
    };
  };
}
async function refreshMode() {
  try { const d = await api("people", { action: "status" }); drawMode(!!d.admin, d.credits); return !!d.admin; }
  catch { drawMode(false); return false; }
}
function reloadVisible() { for (const [id, fn] of [["today", loadToday], ["accounts", loadAccounts]]) if (!$(id).hidden) fn(); }

/* ============ lifecycle: what happened with each account ============ */
function lifeLine(a) {
  const s = a.outreach_status;
  if (s === "contacted") return `Contacted ${ago(a.contacted_at)} · touch ${a.touches}${a.next_followup_at ? ` · next follow-up ${day(a.next_followup_at)}` : " · no more follow-ups planned"}`;
  if (s === "replied") return "They replied. Take it from here";
  if (s === "meeting") return "Meeting booked";
  if (s === "snoozed") return `Snoozed until ${day(a.snoozed_until)}`;
  if (s === "not_now") return "Marked not now";
  return "";
}

/**
 * One primary action per card, chosen from what we already know:
 *  - parked account: Reopen
 *  - no contact yet: Find relevant people
 *  - contact known: Mark contacted (or Contacted again)
 * Everything else lives in the More menu.
 */
function actionsHtml({ outreach, hasContacts, hasDraft, primary: custom, compact }) {
  const parked = outreach === "snoozed" || outreach === "not_now";
  const primary = custom ?? (parked ? `<button class="btn primary" data-life="reopen">Reopen</button>`
    : !hasContacts ? `<button class="btn primary" data-act="people">Find relevant people</button>`
    : `<button class="btn primary" data-life="contacted">${outreach === "contacted" ? "Contacted again" : "Mark contacted"}</button>`);
  const touched = outreach === "contacted" || outreach === "replied" || outreach === "meeting";
  const markInMenu = !parked && (custom != null || !hasContacts);
  const menu = [
    hasContacts ? `<button data-act="people">See all contacts</button>` : "",
    markInMenu ? `<button data-life="contacted">${outreach === "contacted" ? "Contacted again" : "Mark contacted"}</button>` : "",
    compact ? `<button data-act="draft">${hasDraft ? "View draft" : "Draft email"}</button>` : "",
    `<button data-act="dossier">View dossier</button>`,
    parked ? "" : `<hr>${touched ? `<button data-life="reopen">Clear status (reopen)</button>` : ""}<button data-life="replied">They replied</button><button data-life="meeting">Meeting booked</button>
      <button data-life="snooze" data-days="7">Snooze 1 week</button><button data-life="snooze" data-days="14">Snooze 2 weeks</button><button data-life="snooze" data-days="30">Snooze 1 month</button>
      <hr><button data-life="not_now">Not now</button>`,
  ].join("");
  return `<div class="actions">${primary}${compact ? "" : `<button class="btn ghost" data-act="draft">${hasDraft ? "View draft" : "Draft email"}</button>`}
    <div class="menu"><button class="btn ghost" data-tog aria-haspopup="menu">More ▾</button><div class="menu-list" hidden>${menu}</div></div></div>
    <div class="panel dbox"></div><div class="panel draftbox"></div><div class="panel pbox"></div>`;
}

/* ============ Today: lead with the person ============ */
const TODAY_BADGE = { meeting: "accent", follow_up: "warn", hot: "good", new: "", revive: "" };

function tCard(i) {

/* ============ Accounts: every company, one list ============ */
let aview = "all", aq = "";
const FILTERS = [["all", "All"], ["new", "New"], ["nocontact", "No contact yet"], ["tocontact", "Ready to contact"], ["progress", "In progress"], ["parked", "Parked"], ["looked", "Looked up"], ["low", "Low fit"]];
const parkedS = (a) => a.outreach_status === "snoozed" || a.outreach_status === "not_now";
const FILTER_FN = {
  all: (a) => !a.low && !parkedS(a),
  new: (a) => a.is_new && !a.low,
  nocontact: (a) => !a.low && a.outreach_status === "open" && !a.contacts.length,
  tocontact: (a) => !a.low && a.outreach_status === "open" && a.contacts.length > 0,
  progress: (a) => ["contacted", "replied", "meeting"].includes(a.outreach_status),
  parked: parkedS,
  looked: (a) => a.source === "research",
  low: (a) => a.low,
};

function stageText(a) {
  const s = a.outreach_status;
  if (s === "contacted") return `Contacted · touch ${a.touches}`;
  if (s === "replied") return "Replied";
  if (s === "meeting") return "Meeting booked";
  if (s === "snoozed") return `Snoozed until ${day(a.snoozed_until)}`;
  if (s === "not_now") return "Parked";
  if (a.contacts.length) return "Contact found";
  return a.heat !== "watching" ? "Ready" : "Watching";
}

/** The one next step for this company, from what we already know about it. */
function nextStep(a) {
  const s = a.outreach_status, c = a.contacts[0];
  if (parkedS(a)) return `<button class="btn primary sm" data-life="reopen">Reopen</button>`;
  if (s === "meeting") return "";
  if (s === "replied") return `<button class="btn primary sm" data-life="meeting">Meeting booked</button>`;
  if (!c && a.fit === "unknown") return `<button class="btn primary sm" data-act="firmo" title="Looks up size and stage. Uses 0.2 search credit">Check size</button>`;
  if (!c) return `<button class="btn primary sm" data-act="people"${a.searched ? "" : ` title="Uses 1 search credit"`}>${a.searched ? "See people" : "Find people"}</button>`;
  if (!c.revealed && c.email) return `<button class="btn primary sm" data-act="enrich1" data-pid="${esc(c.id)}">Enrich ${esc(c.name.split(" ")[0])}</button>`;
  if (c.revealed && !c.pushed) return `<button class="btn primary sm" data-act="push">Add to HubSpot</button>`;
  return `<button class="btn primary sm" data-life="contacted">${s === "contacted" ? "Contacted again" : "Mark contacted"}</button>`;
}

function contactLine(a) {
  const c = a.contacts[0]; if (!c) return a.searched ? `<div class="contact meta">No relevant person found yet</div>` : "";
  const mail = c.revealed && c.email ? (c.email.includes("***") ? esc(c.email) : `<a href="mailto:${esc(c.email)}">${esc(c.email)}</a>`) : c.email ? "email found, not revealed" : "no email";
  return `<div class="contact"><b>${esc(c.name)}</b> · ${esc(c.title)} · ${mail}${c.pushed ? ` <span class="ptag">In HubSpot</span>` : ""}${a.contacts.length > 1 ? ` <span class="meta">+${a.contacts.length - 1} more</span>` : ""}</div>`;
}

function aCard(a) {
  const ll = ["contacted", "replied", "meeting"].includes(a.outreach_status) ? lifeLine(a) : "";
  const reason = a.is_new && a.found_reason ? `<b>Found automatically</b> from a Hacker News hiring post.` : esc(a.why_now || "");
  return `<article class="card" data-id="${esc(a.id)}" data-name="${esc(a.name)}" data-domain="${esc(a.domain)}">
    <div class="card-head"><div>
      <div class="eyebrow"><span class="badge ${a.heat}">${HEAT[a.heat]}</span>${a.is_new ? `<span class="badge accent">New</span>` : ""}${a.hubspot ? `<span class="badge good">In HubSpot</span>` : ""}${a.outside_icp ? `<span class="badge warn">Outside target size</span>` : ""}<span>${esc(stageText(a))}</span></div>
      <h3 class="title">${esc(a.name)}</h3>
      <div class="meta">${esc(a.segment || a.domain)}</div>${fitLine(a.fit, a.firmo)}
    </div></div>
    ${ll ? `<div class="status-line">${esc(ll)}</div>` : ""}
    ${reason ? `<div class="why">${reason}</div>` : ""}
    ${sigList(a.signals, 1)}
    ${contactLine(a)}
    ${actionsHtml({ outreach: a.outreach_status, hasContacts: a.contacts.length > 0, hasDraft: false, primary: nextStep(a), compact: true })}</article>`;
}

function drawAccounts() {
  const d = ACC, q = aq.trim().toLowerCase();
  const counts = Object.fromEntries(FILTERS.map(([k]) => [k, d.accounts.filter(FILTER_FN[k]).length]));
  const list = d.accounts.filter(FILTER_FN[aview]).filter((a) => !q || a.name.toLowerCase().includes(q) || a.domain.includes(q))
    .sort((x, y) => (HEAT_RANK[x.heat] - HEAT_RANK[y.heat]) || (y.is_new - x.is_new) || ((y.priority ?? -1) - (x.priority ?? -1)));
  const c = $("c-accounts"); const open = d.accounts.filter((a) => !a.low && a.outreach_status === "open").length; c.textContent = open; c.hidden = !open;
  $("ahead").innerHTML = `<div class="banner"><span><b>Auto-discovery:</b> ${esc(d.discovery.added_30d)} new compan${d.discovery.added_30d === 1 ? "y" : "ies"} this month${d.discovery.last ? ` · last run ${esc(ago(d.discovery.last))}` : ""}</span>
      <span>Signals refresh ${d.scan.active ? esc(d.scan.label) : "(paused)"} · next ${esc(day(d.scan.next_scan))}</span></div>
    <div class="toolbar"><div class="chips">${FILTERS.filter(([k]) => counts[k] || k === aview || k === "all").map(([k, l]) => `<button class="chip${k === aview ? " on" : ""}" data-view="${k}">${l}<i>${counts[k]}</i></button>`).join("")}</div>
      <input id="asearch" type="search" placeholder="Search" aria-label="Search companies" value="${esc(aq)}"></div>`;
  $("alist").innerHTML = list.map(aCard).join("") || `<div class="card empty">${aview === "all" ? "Nothing here yet." : "No companies in this view."}</div>`;
  const s = $("asearch"); if (aq) { s.focus(); s.setSelectionRange(aq.length, aq.length); }
}

async function loadAccounts(quiet) {
  if (!quiet) { $("ahead").innerHTML = ""; $("alist").innerHTML = skeleton(4) + skeleton(3); }

$("ahead").addEventListener("click", (e) => { const b = e.target.closest("[data-view]"); if (b) { aview = b.dataset.view; drawAccounts(); } });
$("ahead").addEventListener("input", (e) => { if (e.target.id === "asearch") { aq = e.target.value; drawAccounts(); } });

/* ============ card actions (shared by Today and Accounts) ============ */
function wireCards(root, reload) {
  root.addEventListener("click", async (e) => {
    const life = e.target.closest("button[data-life]");
    if (life) {
      life.disabled = true;
      try {
        const card = life.closest(".card");
        const r = await api("queue", { action: "outcome", account_id: card.dataset.id, kind: life.dataset.life, days: life.dataset.days ? Number(life.dataset.days) : undefined });
        if (r.mode === "dry_run") { say(r.message); life.disabled = false; return; }
        const msg = { contacted: r.next_followup_at ? `Marked contacted. Next follow-up ${day(r.next_followup_at)}.` : "Marked contacted.", replied: "Marked as replied.", meeting: "Meeting booked.", snooze: "Snoozed.", not_now: "Moved to Snoozed & closed.", reopen: "Reopened." }[life.dataset.life];
        say(msg); reload();
      } catch (err) { say(err.message); life.disabled = false; }
      return;
    }

    const btn = e.target.closest("button[data-act]"); if (!btn) return;
    const card = btn.closest(".card"), act = btn.dataset.act;
    if (act === "people") { mountPeople(card.querySelector(".pbox"), card.dataset.name, card.dataset.domain, true); return; }
    if (act === "firmo") {
      btn.disabled = true;
      try {
        const r = await api("queue", { action: "enrich_company", account_id: card.dataset.id });
        if (r.mode === "dry_run") { say(r.message); btn.disabled = false; return; }
        say(r.looked_up ? "Size and stage added." : "No company data found for this domain."); reload();
      } catch (err) { say(err.message); btn.disabled = false; }
      return;
    }
    if (act === "enrich1") {
      btn.disabled = true;
      try {
        const r = await api("people", { action: "enrich", person_id: btn.dataset.pid, what: "email" });
        if (r.mode === "dry_run") { say(r.message); btn.disabled = false; return; }
        say("Email revealed."); reload();
      } catch (err) { say(err.message); btn.disabled = false; }
      return;
    }
    if (act === "push") {
      btn.disabled = true; say("Adding to HubSpot…");
      try {
        const r = await api("people", { action: "push", account_id: card.dataset.id });
        if (r.mode === "dry_run") { say(r.message); btn.disabled = false; return; }
        say(`Added the company and ${r.contacts.length} contact(s) to HubSpot.`); reload();
      } catch (err) { say(err.message); btn.disabled = false; }
      return;
    }
    if (act === "draft") {
      btn.disabled = true; say("Getting the draft…");
      try {
        const r = await api("queue", { action: "draft", account_id: card.dataset.id });
        if (r.mode === "dry_run") { say(r.message); return; }
        const dr = r.draft;
        card.querySelector(".draftbox").innerHTML = `<p class="label">Draft email to ${esc(dr.persona)}</p><div class="draft"><b>${esc(dr.subject)}</b>\n\n${esc(dr.body)}</div>
          <p class="meta" style="margin:8px 0 0">A starting point. Edit it and send it yourself; nothing is sent for you.</p>`;
        $("toast").hidden = true;
      } catch (err) { say(err.message); } finally { btn.disabled = false; }
      return;
    }
    if (act === "dossier") {
      say("Loading the dossier…");
      try {
        const d = await api("research-account", { domain: card.dataset.domain }), x = d.dossier;
        card.querySelector(".dbox").innerHTML = `<p class="label">Dossier${d.cached ? "" : " (just generated)"}</p><p style="margin:0 0 8px">${esc(x.summary)}</p>
          <p class="meta" style="margin:0 0 6px"><b>ICP fit ${esc(x.icp_fit?.score ?? "–")}</b></p>${bullets(x.icp_fit?.reasons)}
          <p class="label" style="margin-top:14px">Likely pains</p>${bullets(x.pains)}`;
        $("toast").hidden = true;
      } catch (err) { say(err.message); }
    }
  });
}

$("tlist").addEventListener("click", (e) => { if (e.target.closest("[data-goto-needs]")) { aview = "nocontact"; document.querySelector('nav.tabs [data-tab="accounts"]').click(); } });
wireCards($("alist"), () => loadAccounts(true));

// "Show more signals" works everywhere
document.addEventListener("click", (e) => {

/* ============ People: find, enrich, preview, push ============ */
const STATUS = { valid: ["Verified", "ok"], accept_all: ["Accepts all", ""], unknown: ["Unverified", ""] };

function strip(c) {
  if (!c) return "";
  const cell = (v, l, tip) => `<div title="${esc(tip)}"><b>${esc(v ?? "–")}</b><span>${l}</span></div>`;
  return `<div class="strip">${cell(c.fit, "ICP fit", "From the dossier. Blank until the company is researched")}${cell(c.priority, "Priority", "Total of all signals")}${cell(c.signal, "Signals", "Hiring, news, community")}${cell(c.intent, "Intent", "Hiring and funding only")}${cell(c.tier_label, "Tier", "Becomes the ICP tier in HubSpot")}</div>`;
}

function mountPeople(box, accountName, domain, autoload) {
  let accountId = null, people = [], msg = "", company = null, dirty = true;

  const row = (p) => {
    const st = STATUS[p.email_status] || ["Unverified", ""];
    const email = p.email_revealed
      ? `<b>${esc(p.email)}</b> <span class="pill ${st[1]}">${st[0]}${p.email_confidence ? " · " + esc(p.email_confidence) + "%" : ""}</span>`
      : `<span class="mask">${esc(p.email || "no email found")}</span>`;
    const action = p.pushed ? `<span class="pill ok">In HubSpot</span>`
      : p.email_revealed ? `<span class="pill ok">Enriched</span>`
      : p.email ? `<div class="menu"><button class="btn ghost sm" data-tog>Enrich ▾</button><div class="menu-list" hidden>
          <button data-en="email">Email</button><button disabled title="Needs a paid data provider">Phone (paid provider)</button><button disabled title="Needs a paid data provider">Email + phone (paid provider)</button></div></div>` : "";
    return `<div class="person${p.persona ? "" : " dim"}" data-pid="${esc(p.id)}"><div>
      <div><span class="pn">${esc(p.name)}</span>${p.persona ? `<span class="ptag">${esc(p.persona)} · ${esc(p.persona_score)}</span>` : ""}</div>
      <div class="pt">${esc(p.title)} at ${esc(accountName)}${p.department ? ` · ${esc(p.department)}` : ""}</div>
      <div class="pe">${email}</div></div><div class="pact">${action}</div></div>`;
  };

  const draw = () => {
    const pushable = people.some((p) => p.email_revealed && !p.pushed);
    box.innerHTML = `<p class="label">Relevant people</p>${strip(company)}${people.map(row).join("")}
      ${msg ? `<p class="meta" style="margin:8px 0 0">${esc(msg)}</p>` : ""}
      ${pushable ? `<details data-preview><summary>What will go to HubSpot</summary><div class="pv"><p class="meta">Loading…</p></div></details>
        <div class="actions" style="margin-top:6px"><button class="btn primary" data-push>Push to HubSpot</button><span class="meta">No AI credits are used for the push.</span></div>` : ""}`;
    dirty = true;
  };

  const find = async () => {
    box.innerHTML = `<p class="label">Relevant people</p><div class="skel"><i></i><i></i></div>`;
    try {
      const d = await api("people", { action: "find", domain });
      accountId = d.account_id; people = d.people; company = d.company;
      msg = d.locked ? d.message : people.length ? (d.cached ? "" : "Found with 1 search credit.") : "No matching people found for this company.";
      draw();
    } catch (err) { msg = err.message; draw(); }
  };

  if (autoload) find();
  else box.innerHTML = `<p class="label">Relevant people</p><div class="actions" style="margin:0"><button class="btn primary" data-find>Find relevant people</button><span class="meta">Searches by your target roles. Uses 1 search credit the first time.</span></div>`;

  box.addEventListener("toggle", async (e) => {
    const det = e.target; if (!det.matches?.("details[data-preview]") || !det.open || !dirty) return;
    dirty = false;
    try {
      const d = await api("people", { action: "preview", account_id: accountId });
      const rows = (f) => `<table>${f.map((x) => `<tr><td>${esc(x.label)}</td><td>${esc(x.value)}</td></tr>`).join("")}</table>`;
      det.querySelector(".pv").innerHTML = `<h4>Company: ${esc(d.company.name)}</h4>${rows(d.company.fields)}
        ${d.contacts.map((c) => `<h4>Contact: ${esc(c.name)} · ${esc(c.title)}</h4>${rows(c.fields)}`).join("")}
        <h4>Note on the company</h4><p class="meta" style="margin:0">${esc(d.note)}</p>`;
    } catch (err) { det.querySelector(".pv").innerHTML = `<p class="err">${esc(err.message)}</p>`; }
  }, true);

  box.onclick = async (e) => {
    const t = e.target.closest("button"); if (!t || t.matches("[data-tog]")) return;
    try {
      if (t.matches("[data-find]")) { await find(); }
      else if (t.matches("[data-en]")) {
        const pid = t.closest(".person").dataset.pid; t.disabled = true;
        const d = await api("people", { action: "enrich", person_id: pid, what: t.dataset.en });
        if (d.mode === "dry_run") { say(d.message); return; }
        people = people.map((p) => (p.id === pid ? d.person : p)); msg = ""; draw();
      } else if (t.matches("[data-push]")) {
        t.disabled = true; say("Pushing to HubSpot…");
        const d = await api("people", { action: "push", account_id: accountId });
        if (d.mode === "dry_run") { say(d.message); t.disabled = false; return; }
        people = people.map((p) => (p.email_revealed ? { ...p, pushed: true } : p));
        msg = `Pushed the company and ${d.contacts.length} contact(s) to HubSpot${d.used_dossier ? ", with the dossier" : ""}.`; draw(); say(msg);
      }
    } catch (err) { say(err.message); t.disabled = false; }
  };
}

/* ============ Research ============ */
function dossierHtml(d) {
  const x = d.dossier, a = d.account, fit = x.icp_fit?.score;
  const tracks = (x.talk_tracks || []).map((t) => `<p class="quote"><b>${esc(t.angle)}</b>${esc(t.opener)}</p>`).join("");
  return `
    <article class="card"><div class="card-head"><div>
      <div class="eyebrow"><span>Account research</span>${d.cached ? "<span>· saved result</span>" : ""}</div>
      <h3 class="title">${esc(a.name)}</h3><div class="sub">${esc(a.domain)}</div>${firmoText(a) ? `<div class="meta">${esc(firmoText(a))}</div>` : ""}
    </div><div class="score" title="ICP fit: how well this company matches your target profile"><b style="color:${scoreColor(fit)}">${esc(fit ?? "–")}</b><span>ICP fit</span></div></div>
    <p style="margin:14px 0 0">${esc(x.summary)}</p><div class="why"><b>Why now.</b> ${esc(x.why_now)}</div></article>
    <article class="card"><div class="cols"><div><p class="label">Why it fits</p>${bullets(x.icp_fit?.reasons)}</div><div><p class="label">Watch out for</p>${bullets(x.risks)}</div></div></article>
    <article class="card"><div class="cols"><div><p class="label">Likely pains</p>${bullets(x.pains)}</div><div><p class="label">Ways in</p>${tracks || '<p class="meta">None.</p>'}</div></div></article>
    <article class="card"><p class="label">Signals (${(d.signals || []).length})</p>${sigList(d.signals, 5) || '<p class="meta">No public signals found.</p>'}</article>
    <article class="card" id="peoplebox"></article>
    <p class="foot">Saved to Accounts under <b>Looked up</b>. Public sources only. Nothing is sent to anyone.</p>`;
}

async function run(domain) {
  $("go").disabled = true;
  $("out").innerHTML = skeleton(3) + `<p class="meta" style="text-align:center">Collecting signals and writing the dossier. About 10 seconds.</p>`;
  try {
    const d = await api("research-account", { domain });
    $("out").innerHTML = dossierHtml(d);
    mountPeople($("peoplebox"), d.account.name, d.account.domain, false);
  } catch (e) { $("out").innerHTML = `<div class="card err">${esc(e.message)}</div>`; }
  finally { $("go").disabled = false; }
}
$("form").addEventListener("submit", (e) => { e.preventDefault(); const v = $("domain").value.trim(); if (v) run(v); });
document.querySelectorAll("[data-d]").forEach((el) => el.addEventListener("click", () => { $("domain").value = el.dataset.d; run(el.dataset.d); }));

/* ============ ICP & Signals playbook ============ */
async function loadIcp() {
  $("icpbody").innerHTML = skeleton(4);
  try {
    const p = await api("queue", { action: "icp" });
    const c = p.company, max = Math.max(...p.signals.map((s) => s.weight));
    $("icpbody").innerHTML = `
      <div class="tiles">
        <div class="tile"><b>${esc(p.stats.companies)}</b><span>companies tracked</span></div>
        <div class="tile"><b style="color:var(--accent)">${esc(p.discovery.added)}</b><span>new companies found this month</span></div>
        <div class="tile"><b>${esc(p.stats.matching)}</b><span>match size and stage (of ${esc(p.stats.enriched)})</span></div>
        <div class="tile"><b>${esc(p.stats.queued)}</b><span>ready to contact</span></div>
</div>
      <article class="card"><p class="label">Who we sell to</p><p style="margin:0 0 14px"><b>${esc(p.seller.name)}</b>: ${esc(p.seller.pitch)}</p>
        <div class="grid2">
          <div><b>Companies</b><div class="tags">${c.industries.map((x) => `<span>${esc(x)}</span>`).join("")}</div>
            <p class="meta" style="margin:8px 0 0">${esc(c.employeesMin)}–${esc(c.employeesMax)} people · ${esc(c.stages.join(", "))} · ${esc(c.regions.join(", "))}</p></div>
          <div><b>People to contact</b>${p.personas.map((x) => `<div>${esc(x.title)}${x.note ? `<div class="meta">${esc(x.note)}</div>` : ""}</div>`).join("")}</div>
        </div></article>
      <article class="card"><p class="label">How new companies are found</p>
        <p style="margin:0">${esc(p.discovery.note)} ${p.discovery.last ? `Last run ${esc(ago(p.discovery.last))}: ${esc(p.discovery.added)} added this month.` : ""} Found companies appear in Accounts under <b>New</b>.</p></article>
      <article class="card"><p class="label">Signals we watch</p>
        ${p.signals.map((s) => `<div class="sigrow"><div style="display:flex;justify-content:space-between;gap:10px"><b>${esc(s.label)}</b><span class="badge accent">${esc(s.weight)} pts</span></div>
          <div class="bar"><i style="width:${(s.weight / max) * 100}%"></i></div><div class="why-t">${esc(s.why)}</div><div class="why-t">Source: ${esc(s.source)}</div></div>`).join("")}
        <p class="meta" style="margin:6px 0 0">Older evidence counts for less: news after 30 days counts half, after 60 days nothing.</p></article>
      <article class="card"><p class="label">How to read a company</p>
        <ul class="plain"><li><b>Fit</b>: is it the right kind of company? Size, funding stage and region against your profile. "Fit unknown" means size and stage have not been looked up yet.</li>
          <li><b>Hot</b>: it fits and something happened in the last week, or it just raised, or it has 2+ sales roles open. <b>Warm</b>: some signal. <b>Watching</b>: nothing right now.</li>
          <li><b>Persona score</b>: how closely a person's title matches a target buyer.</li>
          <li>Behind the scenes a 0 to 100 score (the signals above plus fit) sorts the lists and fills the HubSpot fields.</li></ul></article>
      <article class="card"><p class="label">The daily rhythm</p>
        <ul class="plain"><li><b>Hot now</b>: a new signal in the last ${esc(p.today.hot_hours)} hours.</li>
          <li><b>Follow-up due</b>: ${esc(p.follow_up.note)}</li>
          <li><b>Meeting</b>: booked for the next day and a half, with a private brief emailed to you.</li>
          <li>The Today list holds at most ${esc(p.today.cap)} items. Signals refresh ${esc(p.schedule.toLowerCase())}. Outreach is always manual.</li></ul></article>`;
  } catch (e) { $("icpbody").innerHTML = `<div class="card err">${esc(e.message)}</div>`; }
}

/* ============ Setup: the profile, discovery and costs ============ */
let P = null, SETUP = null;
const getPath = (o, path) => path.split(".").reduce((x, k) => x?.[k], o);
function setPath(o, path, v) { const ks = path.split("."), last = ks.pop(); ks.reduce((x, k) => x[k], o)[last] = v; }

function tagField(path, label, help) {
  const vals = getPath(P, path) || [];
  return `<div class="field"><label>${esc(label)}</label><div class="tagbox" data-tags="${esc(path)}">${vals.map((t) => `<span class="tag">${esc(t)}<button type="button" data-rm="${esc(t)}" aria-label="Remove ${esc(t)}">×</button></span>`).join("")}<input data-add placeholder="Add and press Enter" aria-label="${esc(label)}"></div>${help ? `<p class="help">${esc(help)}</p>` : ""}</div>`;
}
const chipField = (key, label, options, help) => `<div class="field"><span class="lbl">${esc(label)}</span><div class="chips" style="margin:0">${options.map((o) => `<button type="button" class="chip${P[key].includes(o) ? " sel" : ""}" data-toggle="${key}" data-val="${esc(o)}">${esc(o)}</button>`).join("")}</div>${help ? `<p class="help">${esc(help)}</p>` : ""}</div>`;

function drawSetup() {
  const d = SETUP, own = !!d.admin;
  $("setupbody").innerHTML = `
    <article class="card"><p class="label">Who we look for</p>
      ${tagField("industries", "Industries", "Used when the system decides whether a newly found company fits. For example: B2B SaaS, Fintech, Developer tools.")}
      <div class="field"><span class="lbl">Company size (people)</span><div class="numrow"><input type="number" min="1" data-num="employeesMin" value="${esc(P.employeesMin)}" aria-label="Minimum people"> to <input type="number" min="1" data-num="employeesMax" value="${esc(P.employeesMax)}" aria-label="Maximum people"></div></div>
      ${chipField("stages", "Funding stage", d.options.stages)}
      ${chipField("regions", "Where they are based", d.options.regions, "Companies outside these show as Outside range and are hidden under Low fit.")}
    </article>
    <article class="card"><p class="label">Who we contact</p>
      <p class="help" style="margin:0 0 12px">A person whose job title contains one of these words is a good contact. Add your own, such as "chief revenue officer".</p>
      ${P.personas.map((x, i) => tagField(`personas.${i}.match`, x.title)).join("")}
      <div class="field"><span class="lbl">Founders count as the buyer only under</span><div class="numrow"><input type="number" min="2" data-num="founderBelow" value="${esc(P.founderBelow)}" aria-label="Founder size limit"> people</div></div>
    </article>
    <article class="card"><p class="label">What counts as a buying signal</p>
      <div class="toggles">
        <label class="toggle"><input type="checkbox" data-sig="hiring" ${P.signals.hiring ? "checked" : ""}><span>Hiring sales or RevOps roles<small>Public job boards and Hacker News hiring posts</small></span></label>
        <label class="toggle"><input type="checkbox" data-sig="news" ${P.signals.news ? "checked" : ""}><span>Funding and company news<small>Last 60 days; older news counts less</small></span></label>
        <label class="toggle"><input type="checkbox" data-sig="community" ${P.signals.community ? "checked" : ""}><span>Community buzz<small>Hacker News mentions</small></span></label>
      </div>
      <hr class="hr">
      ${tagField("hiringRoles", "Job titles that count as a hiring signal", "A company hiring for any of these is treated as scaling its sales team.")}
    </article>
    <div class="actions" style="margin:0 0 18px"><button class="btn primary" data-save>Save changes</button><span class="meta">${own ? "Saving recalculates every company's fit. No credits are used." : "Demo mode: unlock to save changes."}</span></div>

    <article class="card"><p class="label">Finding new companies</p>
      <label class="toggle" style="margin-bottom:12px"><input type="checkbox" data-disc ${P.discovery ? "checked" : ""}><span>Search for new companies every week<small>${esc(d.discovery.schedule)}. Reads Hacker News hiring posts and keeps companies that match the profile above.</small></span></label>
      <p class="meta" style="margin:0 0 12px">${d.discovery.last ? `Last run ${esc(ago(d.discovery.last))} · ` : ""}${esc(d.discovery.added_30d)} added in the last 30 days. Results appear in Accounts under <b>New</b>.</p>
      <div class="actions" style="margin:0"><button class="btn ghost" data-run="preview">Preview what it would check</button><button class="btn ghost" data-run="live">Run discovery now</button></div>
      <p class="help" style="margin-top:8px">A run costs about 1 cent of AI and up to 0.8 search credit for company size and stage.</p>
      <div id="runout"></div>
    </article>

    <article class="card"><p class="label">Credits and costs</p>
      <div class="tiles" style="margin:0 0 10px"><div class="tile"><b>${esc(d.ai.today_usd.toFixed(2))}</b><span>AI spend today (limit $${esc(d.ai.cap_usd.toFixed(2))})</span></div>
        <div class="tile"><b>${esc(d.unknown_fit)}</b><span>companies with size and stage not checked</span></div></div>
      ${d.unknown_fit ? `<div class="actions" style="margin:0"><button class="btn ghost" data-facts>Check size and stage for ${esc(d.unknown_fit)} companies</button><span class="meta">0.2 search credit each</span></div>` : `<p class="meta" style="margin:0">All companies have their size and stage.</p>`}
      <div id="factsout"></div>
    </article>

    <details class="how"><summary>How scoring and signals work</summary><div id="icpbody"></div></details>`;
}

async function loadSetup() {
  $("setupbody").innerHTML = skeleton(5);
  try { SETUP = await api("queue", { action: "setup" }); P = JSON.parse(JSON.stringify(SETUP.profile)); drawSetup(); }
  catch (e) { $("setupbody").innerHTML = `<div class="card err">${esc(e.message)}</div>`; }
}

(() => {
  const box = $("setupbody");
  const addTag = (inp) => {
    const v = inp.value.trim().replace(/,$/, "").trim(); if (!v) return;
    const path = inp.closest("[data-tags]").dataset.tags, list = getPath(P, path);
    if (!list.some((x) => x.toLowerCase() === v.toLowerCase())) list.push(v.slice(0, 40));
    const had = path; drawSetup(); box.querySelector(`[data-tags="${had}"] input`)?.focus();
  };
  box.addEventListener("keydown", (e) => { if (e.target.matches?.("[data-add]") && (e.key === "Enter" || e.key === ",")) { e.preventDefault(); addTag(e.target); } });
  box.addEventListener("focusout", (e) => { if (e.target.matches?.("[data-add]") && e.target.value.trim()) addTag(e.target); });
  box.addEventListener("change", (e) => {
    const t = e.target;
    if (t.dataset.num) setPath(P, t.dataset.num, Number(t.value));
    if (t.dataset.sig) setPath(P, `signals.${t.dataset.sig}`, t.checked);
    if (t.matches("[data-disc]")) P.discovery = t.checked;
  });
  box.addEventListener("click", async (e) => {
    const rm = e.target.closest("[data-rm]");
    if (rm) { const path = rm.closest("[data-tags]").dataset.tags, list = getPath(P, path); setPath(P, path, list.filter((x) => x !== rm.dataset.rm)); drawSetup(); return; }
    const tg = e.target.closest("[data-toggle]");
    if (tg) { const l = P[tg.dataset.toggle], v = tg.dataset.val; P[tg.dataset.toggle] = l.includes(v) ? l.filter((x) => x !== v) : [...l, v]; drawSetup(); return; }
    const btn = e.target.closest("button"); if (!btn) return;
    if (btn.matches("[data-save]")) {
      btn.disabled = true; say("Saving…");
      try {
        const r = await api("queue", { action: "profile_save", profile: P });
        if (r.mode === "dry_run") { say(r.message); btn.disabled = false; return; }
        SETUP = { ...r, admin: true }; P = JSON.parse(JSON.stringify(r.profile)); drawSetup(); say(`Saved. Recalculated ${r.rescored} companies.`); ACC = null;
      } catch (err) { say(err.message); btn.disabled = false; }
    }
    if (btn.matches("[data-run]")) {
      const dry = btn.dataset.run === "preview";
      if (!dry && !confirm("Run discovery now? About 1 cent of AI and up to 0.8 search credit.")) return;
      btn.disabled = true; $("runout").innerHTML = `<p class="meta">${dry ? "Checking sources…" : "Running. This takes about a minute."}</p>`;
      try {
        const r = await api("queue", { action: "run_discovery", dry });
        if (r.mode === "dry_run") { say(r.message); $("runout").innerHTML = ""; }
        else $("runout").innerHTML = dry
          ? `<p class="meta">${esc(r.collected)} candidates found, ${esc(r.already_known)} already known. Would check: ${esc((r.would_check || []).join(", ") || "nothing new")}.</p>`
          : `<p class="meta">Checked ${esc(r.checked)}. Added ${esc(r.added.length)}${r.added.length ? `: ${esc(r.added.join(", "))}` : ""}. ${esc(r.rejected)} did not fit.</p>`;
      } catch (err) { $("runout").innerHTML = `<p class="err">${esc(err.message)}</p>`; }
      btn.disabled = false;
    }
    if (btn.matches("[data-facts]")) {
      if (!confirm("Look up size and stage for the companies that have none? 0.2 search credit each.")) return;
      btn.disabled = true; $("factsout").innerHTML = `<p class="meta">Looking up…</p>`;
      try {
        const r = await api("queue", { action: "enrich_companies" });
        if (r.mode === "dry_run") { say(r.message); $("factsout").innerHTML = ""; btn.disabled = false; return; }
        say(`Looked up ${r.looked_up} companies.`); ACC = null; loadSetup();
      } catch (err) { $("factsout").innerHTML = `<p class="err">${esc(err.message)}</p>`; btn.disabled = false; }
    }
  });
  box.addEventListener("toggle", (e) => { if (e.target.matches?.("details.how") && e.target.open && !$("icpbody").dataset.done) { $("icpbody").dataset.done = "1"; loadIcp(); } }, true);
})();

/* ============ tabs and start ============ */
document.querySelectorAll("nav.tabs [data-tab]").forEach((b) => b.addEventListener("click", () => {
  document.querySelectorAll("nav.tabs [data-tab]").forEach((x) => x.setAttribute("aria-selected", String(x === b)));
  for (const t of ["today", "research", "accounts", "setup"]) $(t).hidden = b.dataset.tab !== t;
  ({ today: loadToday, accounts: loadAccounts, setup: loadSetup }[b.dataset.tab] || (() => {}))();
}));

drawMode(false);
refreshMode();
loadToday();
api("queue", { action: "accounts" }).then((d) => { ACC = d; const c = $("c-accounts"), n = d.accounts.filter((a) => !a.low && a.outreach_status === "open").length; c.textContent = n; c.hidden = !n; }).catch(() => {});
</script>
</body>
</html>
