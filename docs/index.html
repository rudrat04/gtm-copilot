<script>
const BASE = "https://tecgblsoylrshcqneevf.supabase.co/functions/v1";
const KEY = "sb_publishable_V2QMkeCD8XuuoGkz_sVT5Q_4klZp394";
let adminKey = ""; try { adminKey = localStorage.getItem("cp_admin") || ""; } catch {}

/* ============ helpers ============ */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

let inflight = 0;
const busy = (d) => { inflight = Math.max(0, inflight + d); const b = $("bar"); if (b) b.hidden = inflight === 0; };
async function api(fn, body) {
  busy(1);
  try { return await apiCall(fn, body); } finally { busy(-1); }
}
async function apiCall(fn, body) {
  const res = await fetch(`${BASE}/${fn}`, {
    method: "POST",
    headers: { "Content-Type": "application/json", apikey: KEY, Authorization: `Bearer ${KEY}`, ...(adminKey ? { "x-admin-key": adminKey } : {}) },
    body: JSON.stringify(body),
  });
  const d = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(d.error || `Request failed (${res.status})`);
  return d;
}

let toastTimer;
function say(msg, action) {
  const t = $("toast"); t.textContent = "";
  if (/(…|\.\.\.)$/.test(msg)) { const sp = document.createElement("span"); sp.className = "spin"; sp.setAttribute("aria-hidden", "true"); t.append(sp); } // work in progress
  t.append(document.createTextNode(msg));
  if (action) { const b = document.createElement("button"); b.type = "button"; b.textContent = action.label; b.onclick = () => { t.hidden = true; action.run(); }; t.append(b); }
  t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), action ? 9000 : 4200);
}
/** Our own confirm box (the browser one looks out of place). Resolves true or false. */
function ask({ title, body, ok = "Continue", danger = false }) {
  return new Promise((resolve) => {
    const bg = document.createElement("div"); bg.className = "modal-bg";
    bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h3>${esc(title)}</h3><p>${esc(body || "")}</p><div class="row"><button type="button" class="btn ghost" data-no>Cancel</button><button type="button" class="btn ${danger ? "danger" : "primary"}" data-yes>${esc(ok)}</button></div></div>`;
    const done = (v) => { bg.remove(); document.removeEventListener("keydown", key); resolve(v); };
    const key = (e) => { if (e.key === "Escape") done(false); };
    bg.addEventListener("click", (e) => { if (e.target === bg || e.target.closest("[data-no]")) done(false); else if (e.target.closest("[data-yes]")) done(true); });
    document.addEventListener("keydown", key); document.body.append(bg); bg.querySelector("[data-yes]").focus();
  });
}

const days = (iso) => { const t = Date.parse(iso); return Number.isNaN(t) ? null : Math.floor((Date.now() - t) / 864e5); };
function ago(iso) {
  const t = Date.parse(iso); if (!t) return "";
  const h = (Date.now() - t) / 36e5;
  if (h < 1) return "just now"; if (h < 24) return `${Math.floor(h)}h ago`;
  const d = Math.floor(h / 24); return d === 1 ? "yesterday" : `${d} days ago`;
}
const day = (iso) => new Date(iso).toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" });
const scoreColor = (n) => (n >= 70 ? "var(--good)" : n >= 40 ? "var(--warn)" : "var(--bad)");
const money = (n) => (n >= 1e9 ? `$${(n / 1e9).toFixed(1)}B` : n >= 1e6 ? `$${Math.round(n / 1e6)}M` : `$${Math.round(n / 1e3)}K`);
const firmoText = (a) => !a?.firmo_at ? "" : [a.employee_band ? `${a.employee_band} people` : a.employees ? `${a.employees} people` : null, a.stage && !/^(other|unknown|undisclosed)$/i.test(a.stage) ? a.stage : null, a.raised_usd ? `${money(a.raised_usd)} raised` : null, a.hq_city || a.country].filter(Boolean).join(" · ");
const TIERS = { tier_1: ["Tier 1", "t1"], tier_2: ["Tier 2", "t2"], tier_3: ["Tier 3", "t3"] };
const tierHtml = (t) => (TIERS[t] ? `<span class="tier ${TIERS[t][1]}">${TIERS[t][0]}</span>` : "");
const FIT = { matches: ["Fits", "good"], close: ["Partly fits", "warn"], unknown: ["Fit unknown", ""], outside: ["Outside range", "bad"] };
const fitLine = (state, firmo) => { const f = FIT[state] || FIT.unknown; return `<div class="fit"><b class="${f[1]}">${f[0]}</b>${firmo ? ` · ${esc(firmo)}` : state === "unknown" ? " · size and stage not checked yet" : ""}</div>`; };
const HEAT = { hot: "Hot", warm: "Warm", watching: "Watching" }, HEAT_RANK = { hot: 0, warm: 1, watching: 2 };
const skeleton = (n = 3) => `<div class="card"><div class="skel">${"<i></i>".repeat(n)}</div></div>`;
const bullets = (a) => (a?.length ? `<ul class="plain">${a.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>` : `<p class="meta">Nothing found.</p>`);

/* ============ signals: a short, tidy list ============ */
function sigRow(s, hidden = false) {
  const summary = /\d+ open roles/.test(s.title);
  const k = s.kind === "hn" ? ["HN", "hn"] : s.kind === "news" ? ["News", "news"] : s.kind === "tech" ? ["Tools", "news"] : ["Hiring", "hiring"];
  let text = s.title.replace(/^Hiring:\s*/i, "").replace(/^Hacker News:\s*/i, "").trim();
  if (summary) text = `Currently ${text}`;
  const stamp = s.published || s.first_seen, days = (Date.now() - Date.parse(stamp)) / 864e5;
  const when = summary ? "" : ago(stamp);
  const fresh = !summary && !Number.isNaN(days) && (days < 14 ? " fresh" : days <= 30 ? " mid" : " old");
  const body = s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(text)}</a>` : esc(text);
  return `<li${hidden ? " hidden data-more" : ""}><span class="k ${k[1]}">${k[0]}</span><span class="t" title="${esc(s.title)}">${body}</span><span class="when${fresh || ""}">${esc(when)}</span></li>`;
}
function sigList(signals, max = 3) {
  const sorted = [...(signals || [])].sort((a, b) => (/\d+ open roles/.test(a.title) ? 1 : 0) - (/\d+ open roles/.test(b.title) ? 1 : 0));
  if (!sorted.length) return "";
  const head = sorted.slice(0, max).map((x) => sigRow(x)).join(""), rest = sorted.slice(max).map((x) => sigRow(x, true)).join("");
  return `<ul class="sigs">${head}${rest}</ul>${rest ? `<button class="btn link sm sigs-more" data-more-toggle>Show ${sorted.length - max} more signal${sorted.length - max > 1 ? "s" : ""}</button>` : ""}`;
}
const newCount = (signals) => (signals || []).filter((s) => s.is_new && !(s.kind === "hiring" && /\d+ open roles/.test(s.title))).length;

/* ============ owner mode ============ */
function drawMode(admin, credits) {
  const el = $("mode");
  el.className = `mode${admin ? " owner" : ""}`;
  el.innerHTML = admin
    ? `<span class="dot"></span>Owner${credits ? ` <a class="credits${credits.remaining < 8 ? " out" : credits.remaining < 20 ? " low" : ""}" href="#/setup/conn" title="Search credits left this month. Click for the Health panel">${credits.remaining} of ${credits.available} credits left</a>` : ""}<button class="btn ghost sm" id="lock">Lock</button>`
    : `<span class="dot"></span>Demo mode<button class="btn ghost sm" id="unlock">Unlock</button>`;
  if (admin) $("lock").onclick = () => { adminKey = ""; try { localStorage.removeItem("cp_admin"); } catch {} refreshMode(); reloadVisible(); };
  else $("unlock").onclick = () => {
    el.innerHTML = `<span class="dot"></span><input id="keyin" type="password" placeholder="Owner key" aria-label="Owner key" autocomplete="off"><button class="btn ghost sm" id="keyno">Cancel</button>`;

/* ============ lifecycle: what happened with each account ============ */
function lifeLine(a) {
  const s = a.outreach_status;
  if (s === "contacted") return `Contacted ${ago(a.contacted_at)} · touch ${a.touches}${a.next_followup_at ? ` · next follow-up ${day(a.next_followup_at)}` : " · no more follow-ups planned"}`;
  if (s === "replied") return "They replied. Take it from here";
  if (s === "meeting") return "Meeting booked";
  if (s === "snoozed") return `Snoozed until ${day(a.snoozed_until)}`;
  if (s === "not_now") return "Marked not now";
  return "";
}

/**
 * One primary action per card, chosen from what we already know:
 *  - parked account: Reopen

 *  - contact known: Mark contacted (or Contacted again)
 * Everything else lives in the More menu.
 */
function actionsHtml({ outreach, hasContacts, hasDraft, primary: custom, compact, extra = "", removable = false }) {
  const parked = outreach === "snoozed" || outreach === "not_now";
  const primary = custom ?? (parked ? `<button class="btn primary" data-life="reopen">Reopen</button>`
    : !hasContacts ? `<button class="btn primary" data-act="people">Find relevant people</button>`
    : `<button class="btn primary" data-life="contacted">${outreach === "contacted" ? "Contacted again" : "Mark contacted"}</button>`);
  const touched = outreach === "contacted" || outreach === "replied" || outreach === "meeting";
  const markInMenu = !parked && (custom != null || !hasContacts);
  const menu = [
    hasContacts ? `<button data-act="people">See all people</button>` : "",
    extra,
    markInMenu ? `<button data-life="contacted">${outreach === "contacted" ? "Contacted again" : "Mark contacted"}</button>` : "",
    compact ? `<button data-act="draft">${hasDraft ? "View draft" : "Draft email"}</button>` : "",
    `<button data-act="dossier">View dossier</button>`,

    compact ? `<button data-act="aiscore" title="About 0.3 cent of AI">Score again with AI</button>` : "",
    parked ? "" : `<hr>${touched ? `<button data-life="reopen">Clear status (reopen)</button>` : ""}<button data-life="replied">They replied</button><button data-life="meeting">Meeting booked</button>
      <button data-life="snooze" data-days="7">Snooze 1 week</button><button data-life="snooze" data-days="14">Snooze 2 weeks</button><button data-life="snooze" data-days="30">Snooze 1 month</button>
      <hr><button data-life="not_now">Not now</button><button data-act="notfit">Not a fit…</button>`,
    removable ? `<button data-act="remove">Remove this company…</button>` : "",
  ].join("");
  return `<div class="actions">${primary}${compact && hasContacts && removable ? `<button class="btn ghost sm" data-act="morepeople" title="Searches again for more people. Uses 1 to 2 search credits">Find more people</button>` : ""}${compact ? "" : `<button class="btn ghost" data-act="draft">${hasDraft ? "View draft" : "Draft email"}</button>`}

}

  ["origin", "Where from", [["", "Any"], ["new", "New this fortnight"], ["auto", "Found automatically"], ["inbound", "Inbound lead"], ["looked", "Looked up by me"], ["hubspot", "Imported from HubSpot"], ["lost", "Closed-lost"]],
    (a, v) => ({ new: a.is_new, auto: a.source === "discovered", inbound: a.source === "inbound", looked: a.source === "research", hubspot: a.source === "hubspot", lost: !!a.lost_at })[v]],
];

    <section class="blk"><p class="label">Signals</p>${sigList(a.signals, 2) || `<p class="meta" style="margin:0"><span class="unk">No signals yet</span></p>`}</section>
    <section class="blk"><p class="label">Best contact</p>${contact || `<div class="contact meta"><span class="unk">No contact yet</span></div>`}</section>
    ${a.removed ? `<div class="actions">${nextStep(a)}</div>` : actionsHtml({ outreach: a.outreach_status, hasContacts: a.contacts.length > 0, hasDraft: false, primary: nextStep(a), compact: true, removable: !progressS(a), extra: !a.firmo_known && a.contacts.length ? `<button data-act="firmo" title="Uses 0.2 search credit">Check size and stage</button>` : "" })}</article>`;
}

function drawAccounts() {
  const d = ACC;
  const view = VIEWS.find(([k]) => k === AF.view) || VIEWS[0];
  const counts = Object.fromEntries(VIEWS.map(([k, , , fn]) => [k, d.accounts.filter(fn).length]));
  const q = AF.q.trim().toLowerCase();
  const sort = (SORTS.find(([k]) => k === AF.sort) || SORTS[0])[2];
  const base = d.accounts.filter(view[3]);
  const list = base.filter((a) => SELECTS.every(([k, , , fn]) => !AF[k] || fn(a, AF[k])))
    .filter((a) => !q || a.name.toLowerCase().includes(q) || a.domain.includes(q) || (a.segment || "").toLowerCase().includes(q)).sort(sort);
  const unchecked = d.accounts.filter((a) => !a.removed && !a.firmo_known).length; // companies whose size and stage were never looked up
  const c = $("c-accounts"); const open = counts.open; c.textContent = open; c.hidden = !open;
  const sel = ([k, label, opts]) => `<label>${label}<select data-f="${k}" class="${AF[k] && AF[k] !== "best" ? "set" : ""}" aria-label="${label}">${opts.map(([v, t]) => `<option value="${esc(v)}"${AF[k] === v ? " selected" : ""}>${esc(t)}</option>`).join("")}</select></label>`;
  $("ahead").innerHTML = `${viewSwitch("companies")}<div class="banner"><span><b>Auto-discovery:</b> ${esc(d.discovery.added_30d)} new compan${d.discovery.added_30d === 1 ? "y" : "ies"} this month${d.discovery.last ? ` · last run ${esc(ago(d.discovery.last))}` : ""}</span>
      <span>Signals refresh ${d.scan.active ? esc(d.scan.label) : "(paused)"} · next ${esc(day(d.scan.next_scan))}</span></div>
    <div class="fpanel">
      <div class="seg" role="tablist" aria-label="Companies">${VIEWS.map(([k, l, tip]) => `<button role="tab" aria-selected="${k === AF.view}" class="${k === AF.view ? "on" : ""}" data-view="${k}" title="${esc(tip)}">${l}<i>${counts[k]}</i></button>`).join("")}</div>
      <details class="fdet" ${fOpen || filtersOn() ? "open" : ""}><summary>Filters and sorting${activeCount() ? ` <span class="badge accent">${activeCount()} on</span>` : ""}</summary>
        <div class="fgrid">${SELECTS.map(sel).join("")}${sel(["sort", "Sort by", SORTS.map(([k, l]) => [k, l])])}</div></details>
      ${d.admin ? `<form class="wadd" data-wadd><input type="text" id="wdomain" placeholder="Follow a company: type its website, for example example.com" aria-label="Website of a company to follow" maxlength="80"><button type="submit" class="btn ghost">Follow</button></form>` : ""}
      <input id="asearch" class="fsearch" type="search" placeholder="Search by name, website or what they do" aria-label="Search companies" value="${esc(AF.q)}">
      <div class="fbar"><span>Showing <b>${list.length}</b> of ${base.length} in ${esc(view[1])}</span>
        <span class="acts">${filtersOn() ? `<button class="btn link sm" data-clear>Clear filters</button>` : ""}${d.admin && AF.view === "low" && list.length ? `<button class="btn ghost sm" data-bulkremove title="Removes low-fit companies nobody has touched">Remove all low fit</button>` : ""}${d.admin && d.ai_missing ? `<button class="btn ghost sm" data-bulkai title="The AI judges how hot each company is, from everything we know. About 0.3 cent each">Score with AI (${d.ai_missing})</button>` : ""}${d.admin && d.industry_missing ? `<button class="btn ghost sm" data-bulkind title="Reads each company's website to find its industry. About 0.15 cent each">Check industry (${d.industry_missing})</button>` : ""}${d.admin && unchecked ? `<button class="btn ghost sm" data-bulkfacts title="Looks up company size and stage. 0.2 search credit each">Check size and stage (${unchecked})</button>` : ""}${d.admin ? `<button class="btn ghost sm" data-bulkfind title="Searches your best hot companies that have nobody attached">Find people for the top companies</button>` : ""}</span></div>
    </div>`;
  $("alist").innerHTML = list.map(aCard).join("") || `<div class="card empty">${filtersOn() ? "No companies match these filters." : AF.view === "open" ? "Nothing to work right now." : "No companies in this view."}${filtersOn() ? `<br><button class="btn link" data-clear>Clear filters</button>` : `<div class="actions" style="justify-content:center;margin-top:12px"><button type="button" class="btn ghost sm" data-do="discover">Find new companies</button><button type="button" class="btn ghost sm" data-do="follow">Follow a company</button></div>`}</div>`;
  if (PENDING_CLICK) { const el = document.querySelector(PENDING_CLICK); PENDING_CLICK = null; el?.click(); }
  const s = $("asearch"); if (AF.q && document.activeElement?.id === "asearch") { s.focus(); s.setSelectionRange(AF.q.length, AF.q.length); }
}

async function loadAccounts(quiet) {
  if (!quiet) { $("ahead").innerHTML = ""; $("alist").innerHTML = skeleton(4) + skeleton(3); }

  catch (e) { $("alist").innerHTML = `<div class="card err">${esc(e.message)}</div>`; }
}

      say("Reading websites…");
      const r = await api("queue", { action: "industry_check", dry: false });
      say(`Industry found for ${r.set} of ${r.done} companies.${r.stopped ? ` Stopped: ${r.stopped}.` : ""}`); ACC = null; loadAccounts(true);
    } catch (err) { say(err.message); } finally { bi.disabled = false; }
    return;
  }
  const bk = e.target.closest("[data-bulkfacts]");
  if (bk) {
    const n = ACC.accounts.filter((a) => !a.removed && !a.firmo_known).length;
    if (!(await ask({ title: `Check size and stage for ${n} compan${n === 1 ? "y" : "ies"}?`, body: `Looks up headcount, funding stage and location.\n\nCost: about ${(n * 0.2).toFixed(1)} search credits (0.2 each).`, ok: "Check" }))) return;
    bk.disabled = true; say("Checking size and stage…");
    try {
      const r = await api("queue", { action: "enrich_companies" });
      if (r.mode === "dry_run") { say(r.message); return; }
      say(`Looked up ${r.looked_up} compan${r.looked_up === 1 ? "y" : "ies"}${r.no_data ? `, ${r.no_data} had no data` : ""}.`); ACC = null; loadAccounts(true);
    } catch (err) { say(err.message); } finally { bk.disabled = false; }
    return;
  }
  const bf = e.target.closest("[data-bulkfind]"); if (!bf) return;
  bf.disabled = true; say("Checking who to search…");
  try {
    const p = await api("queue", { action: "find_people_bulk", limit: 5, dry: true });
    if (p.mode === "dry_run") { say(p.message); return; }
    if (!p.plan.length) { say(`No hot or warm company without people${p.waiting ? "" : " that passes your fit bar"}.`); return; }
    const bal = p.balance ? ` You have ${p.balance.remaining} of ${p.balance.available} credits left this month.` : "";
    if (!(await ask({ title: `Search for people at ${p.plan.length} compan${p.plan.length > 1 ? "ies" : "y"}?`, body: `${p.plan.map((x) => `${x.name} (${x.heat})`).join("\n")}\n\nCost: ${p.credits_min} to ${p.credits_max} search credits (1 each, a second only if the first finds fewer than 3 people).${bal}`, ok: "Search" }))) return;
    say("Searching…");
    const r = await api("queue", { action: "find_people_bulk", limit: 5, dry: false });
    const found = r.done.reduce((a, d) => a + d.stored, 0);
    say(`Searched ${r.done.length} compan${r.done.length === 1 ? "y" : "ies"}, found ${found} people, used ${r.spent} credit${r.spent === 1 ? "" : "s"}.${r.stopped ? ` Stopped: ${r.stopped}.` : ""}`);
    ACC = null; loadAccounts(true);

});

/* ============ card actions (shared by Today and Accounts) ============ */
function wireCards(root, reload) {
  root.addEventListener("click", async (e) => {
    const life = e.target.closest("button[data-life]");
    if (life) {
      life.disabled = true;
      try {
        const card = life.closest(".card");
        const r = await api("queue", { action: "outcome", account_id: card.dataset.id, kind: life.dataset.life, days: life.dataset.days ? Number(life.dataset.days) : undefined });
        if (r.mode === "dry_run") { say(r.message); life.disabled = false; return; }
        const msg = { contacted: r.next_followup_at ? `Marked contacted. Next follow-up ${day(r.next_followup_at)}.` : "Marked contacted.", replied: "Marked as replied.", meeting: "Meeting booked.", snooze: "Snoozed.", not_now: "Moved to Snoozed & closed.", reopen: "Reopened." }[life.dataset.life];
        say(msg); reload();
      } catch (err) { say(err.message); life.disabled = false; }
      return;
    }

    const nf = e.target.closest("[data-nfreason]");
    if (nf) {
      const card = nf.closest(".card"); nf.disabled = true; say("Saving…");
      try {
        const r = await api("queue", { action: "not_fit", account_id: card.dataset.id, reason: nf.dataset.nfreason });
        if (r.mode === "dry_run") { say(r.message); nf.disabled = false; return; }
        say(`Marked not a fit: ${r.label}.${r.also ? ` ${r.also}` : ""}${r.crm?.length ? " HubSpot updated." : ""}`); reload();
      } catch (err) { say(err.message); nf.disabled = false; }
      return;
    }
    const btn = e.target.closest("button[data-act]"); if (!btn) return;
    const card = btn.closest(".card"), act = btn.dataset.act;
    if (act === "people") { mountPeople(card.querySelector(".pbox"), card.dataset.name, card.dataset.domain, true); return; }
    if (act === "morepeople") {
      if (!(await ask({ title: `Search again for people at ${card.dataset.name}?`, body: "Looks for more relevant people. Uses 1 to 2 search credits. People you already have are kept.", ok: "Search" }))) return;
      mountPeople(card.querySelector(".pbox"), card.dataset.name, card.dataset.domain, true, true); return;
    }
    if (act === "remove" || act === "restore") {
      const id = card.dataset.id, name = card.dataset.name;
      if (act === "remove" && !(await ask({ title: `Remove ${name}?`, body: "It disappears from every list and is never found or imported again. Nothing is changed in HubSpot. You can bring it back from the Removed view.", ok: "Remove", danger: true }))) return;
      btn.disabled = true;
      try {
        const r = await api("queue", { action: act === "remove" ? "remove_account" : "restore_account", account_id: id });
        if (r.mode === "dry_run") { say(r.message); btn.disabled = false; return; }
        say(act === "remove" ? `${name} removed.` : `${name} restored.`, act === "remove" ? { label: "Undo", run: async () => { await api("queue", { action: "restore_account", account_id: id }); say(`${name} restored.`); reload(); } } : undefined);
        reload();
      } catch (err) { say(err.message); btn.disabled = false; }
      return;
    }
    if (act === "notfit") {
      const reasons = Object.entries(NOT_FIT);
      card.querySelector(".nfbox").innerHTML = `<p class="label">Why is ${esc(card.dataset.name)} not a fit?</p><div class="chips" style="margin:0">${reasons.map(([k, l]) => `<button type="button" class="chip" data-nfreason="${esc(k)}">${esc(l)}</button>`).join("")}</div>
        <p class="meta" style="margin:8px 0 0">It moves to Parked. The reason is saved so the fit settings can be tuned later.</p>`;
      return;
    }
    if (act === "aiscore") {
      btn.disabled = true; say("Asking the AI…");
      try { const r = await api("queue", { action: "ai_rescore", account_id: card.dataset.id }); if (r.mode === "dry_run") { say(r.message); btn.disabled = false; return; } say("Scored."); reload(); }
      catch (err) { say(err.message); btn.disabled = false; }
      return;
    }
    if (act === "plnews") {
      btn.disabled = true; say("Checking company news…");
      try {
        const r = await api("queue", { action: "pl_refresh", account_id: card.dataset.id });
        if (r.mode === "dry_run") { say(r.message); btn.disabled = false; return; }
        say(r.skipped ? `Not checked: ${r.skipped}.` : r.error ? r.error : `${r.added ? `${r.added} new signal${r.added > 1 ? "s" : ""}` : "Nothing new"} (${r.events} events read). ${r.used} of ${r.cap} monthly calls used.`);
        if (!r.skipped && !r.error) reload(); else btn.disabled = false;
      } catch (err) { say(err.message); btn.disabled = false; }
      return;
    }
    if (act === "firmo") {
      btn.disabled = true;
      try {
        const r = await api("queue", { action: "enrich_company", account_id: card.dataset.id });
        if (r.mode === "dry_run") { say(r.message); btn.disabled = false; return; }
        say(r.looked_up ? "Size and stage added." : "No company data found for this domain."); reload();
      } catch (err) { say(err.message); btn.disabled = false; }
      return;
    }
    if (act === "enrich1") {
      btn.disabled = true;
      try {
        const r = await api("people", { action: "enrich", person_id: btn.dataset.pid, what: "email" });
        if (r.mode === "dry_run") { say(r.message); btn.disabled = false; return; }
        say("Email revealed."); reload();
      } catch (err) { say(err.message); btn.disabled = false; }
      return;
    }
    if (act === "push") {
      btn.disabled = true; say("Adding to HubSpot…");
      try {
        const r = await api("people", { action: "push", account_id: card.dataset.id });
        if (r.mode === "dry_run") { say(r.message); btn.disabled = false; return; }
        say(`Added the company and ${r.contacts.length} contact(s) to HubSpot.`); reload();
      } catch (err) { say(err.message); btn.disabled = false; }
      return;
    }
    if (act === "draft") {
      btn.disabled = true; say("Getting the draft…");
      try {
        const r = await api("queue", { action: "draft", account_id: card.dataset.id });
        if (r.mode === "dry_run") { say(r.message); return; }
        const dr = r.draft;
        card.querySelector(".draftbox").innerHTML = `<p class="label">Draft email to ${esc(dr.persona)}</p><div class="draft"><b>${esc(dr.subject)}</b>\n\n${esc(dr.body)}</div>
          <p class="meta" style="margin:8px 0 0">A starting point. Edit it and send it yourself; nothing is sent for you.</p>`;
        $("toast").hidden = true;
      } catch (err) { say(err.message); } finally { btn.disabled = false; }
      return;
    }
    if (act === "dossier") {
      say("Loading the dossier…");
      try {
        const d = await api("research-account", { domain: card.dataset.domain }), x = d.dossier;
        card.querySelector(".dbox").innerHTML = `<p class="label">Dossier${d.cached ? "" : " (just generated)"}</p><p style="margin:0 0 8px">${esc(x.summary)}</p>
          <p class="meta" style="margin:0 0 6px"><b>ICP fit ${esc(x.icp_fit?.score ?? "–")}</b></p>${bullets(x.icp_fit?.reasons)}
          <p class="label" style="margin-top:14px">Likely pains</p>${bullets(x.pains)}`;
        $("toast").hidden = true;
      } catch (err) { say(err.message); }
    }
  });
}

/* ============ People: find, enrich, preview, push ============ */
const STATUS = { valid: ["Verified", "ok"], accept_all: ["Accepts all", ""], unknown: ["Unverified", ""] };

function strip(c) {
  if (!c) return "";
  const cell = (v, l, tip) => `<div title="${esc(tip)}"><b>${esc(v ?? "–")}</b><span>${l}</span></div>`;
  return `<div class="strip">${cell(c.fit, "ICP fit", "From the dossier. Blank until the company is researched")}${cell(c.priority, "Priority", "Total of all signals")}${cell(c.signal, "Signals", "Hiring, news, community")}${cell(c.intent, "Intent", "Hiring and funding only")}${cell(c.tier_label, "Tier", "Becomes the ICP tier in HubSpot")}</div>`;
}

function mountPeople(box, accountName, domain, autoload, refresh = false) {
  let accountId = null, people = [], msg = "", company = null, dirty = true;

  const row = (p) => {
    const st = STATUS[p.email_status] || ["Unverified", ""];
    const email = p.email_revealed
      ? `<b>${esc(p.email)}</b> <span class="pill ${st[1]}">${st[0]}${p.email_confidence ? " · " + esc(p.email_confidence) + "%" : ""}</span>`
      : `<span class="mask">${esc(p.email || "no email found")}</span>`;
    const blockedPerson = p.hs_status === "opted_out" || p.hs_status === "bounced";
    const action = blockedPerson ? `<span class="pill bad" title="${esc(p.hs_note || "")}">${p.hs_status === "opted_out" ? "Opted out" : "Bounced"}</span>`
      : p.pushed ? `<span class="pill ok">In HubSpot</span>`
      : p.email_revealed ? `<span class="pill ok">Enriched</span>`
      : p.email ? `<div class="menu"><button class="btn ghost sm" data-tog>Enrich ▾</button><div class="menu-list" hidden>
          <button data-en="email">Email</button><button disabled title="Needs a paid data provider">Phone (paid provider)</button><button disabled title="Needs a paid data provider">Email + phone (paid provider)</button></div></div>` : "";
    return `<div class="person${p.persona ? "" : " dim"}" data-pid="${esc(p.id)}"><div>
      <div><span class="pn">${esc(p.name)}</span>${p.persona ? `<span class="ptag">${esc(p.persona)} · ${esc(p.persona_score)}</span>` : ""}</div>
      <div class="pt">${esc(p.title)} at ${esc(accountName)}${p.department ? ` · ${esc(p.department)}` : ""}</div>${p.hs_status === "known" ? `<div class="pt warnx">${esc(p.hs_note || "Already in your HubSpot.")}</div>` : ""}
      <div class="pe">${email}</div></div><div class="pact">${watchBtn("person", p.id, !!p.watched)}${action}</div></div>`;
  };

  const draw = () => {
    const pushable = people.some((p) => p.email_revealed && !p.pushed);
    box.innerHTML = `<p class="label">Relevant people</p>${strip(company)}${people.map(row).join("")}
      ${msg ? `<p class="meta" style="margin:8px 0 0">${esc(msg)}</p>` : ""}
      ${pushable ? `<details data-preview><summary>What will go to HubSpot</summary><div class="pv"><p class="meta">Loading…</p></div></details>
        <div class="actions" style="margin-top:6px"><button class="btn primary" data-push>Push to HubSpot</button><span class="meta">No AI credits are used for the push.</span></div>` : ""}`;
    dirty = true;
  };

  const find = async () => {
    box.innerHTML = `<p class="label">Relevant people</p><div class="skel"><i></i><i></i></div>`;
    try {
      const d = await api("people", { action: "find", domain, refresh });
      accountId = d.account_id; people = d.people; company = d.company;
      msg = d.locked ? d.message : people.length ? (d.cached ? "" : refresh ? `Searched again with ${d.credits_spent ?? 1} search credit${d.credits_spent === 1 ? "" : "s"}.` : `Found with ${d.credits_spent ?? 1} search credit${d.credits_spent === 2 ? "s" : ""}.`) : "No matching people found for this company.";
      draw();
    } catch (err) { msg = err.message; draw(); }
  };

  if (autoload) find();
  else box.innerHTML = `<p class="label">Relevant people</p><div class="actions" style="margin:0"><button class="btn primary" data-find>Find relevant people</button><span class="meta">Searches by your target roles. Uses 1 search credit the first time.</span></div>`;

  box.addEventListener("toggle", async (e) => {
    const det = e.target; if (!det.matches?.("details[data-preview]") || !det.open || !dirty) return;
    dirty = false;
    try {
      const d = await api("people", { action: "preview", account_id: accountId });
      const rows = (f) => `<table>${f.map((x) => `<tr><td>${esc(x.label)}</td><td>${esc(x.value)}</td></tr>`).join("")}</table>`;
      det.querySelector(".pv").innerHTML = `<h4>Company: ${esc(d.company.name)}</h4>${rows(d.company.fields)}
        ${d.contacts.map((c) => `<h4>Contact: ${esc(c.name)} · ${esc(c.title)}</h4>${rows(c.fields)}`).join("")}
        <h4>Note on the company</h4><p class="meta" style="margin:0">${esc(d.note)}</p>`;
    } catch (err) { det.querySelector(".pv").innerHTML = `<p class="err">${esc(err.message)}</p>`; }
  }, true);

  box.onclick = async (e) => {
    const t = e.target.closest("button"); if (!t || t.matches("[data-tog]")) return;
    try {
      if (t.matches("[data-find]")) { await find(); }
      else if (t.matches("[data-en]")) {
        const pid = t.closest(".person").dataset.pid; t.disabled = true;
        const d = await api("people", { action: "enrich", person_id: pid, what: t.dataset.en });
        if (d.mode === "dry_run") { say(d.message); return; }
        people = people.map((p) => (p.id === pid ? d.person : p)); msg = ""; draw();
      } else if (t.matches("[data-push]")) {
        t.disabled = true; say("Pushing to HubSpot…");
        const d = await api("people", { action: "push", account_id: accountId });
        if (d.mode === "dry_run") { say(d.message); t.disabled = false; return; }
        people = people.map((p) => (p.email_revealed ? { ...p, pushed: true } : p));
        msg = `Pushed the company and ${d.contacts.length} contact(s) to HubSpot${d.used_dossier ? ", with the dossier" : ""}.`; draw(); say(msg);
      }
    } catch (err) { say(err.message); t.disabled = false; }
  };
}

/* ============ Research ============ */
function dossierHtml(d) {
  const x = d.dossier, a = d.account, fit = x.icp_fit?.score;
  const tracks = (x.talk_tracks || []).map((t) => `<p class="quote"><b>${esc(t.angle)}</b>${esc(t.opener)}</p>`).join("");
  return `
    <article class="card"><div class="card-head"><div>
      <div class="eyebrow"><span>Account research</span>${d.cached ? "<span>· saved result</span>" : ""}${a.id ? watchBtn("company", a.id, !!a.watched_at) : ""}</div>
      <h3 class="title">${esc(a.name)}</h3><div class="sub">${esc(a.domain)}</div>${firmoText(a) ? `<div class="meta">${esc(firmoText(a))}</div>` : ""}
    </div><div class="score" title="ICP fit: how well this company matches your target profile"><b style="color:${scoreColor(fit)}">${esc(fit ?? "–")}</b><span>ICP fit</span></div></div>
    <p style="margin:14px 0 0">${esc(x.summary)}</p><div class="why"><b>Why now.</b> ${esc(x.why_now)}</div></article>
    <article class="card"><div class="cols"><div><p class="label">Why it fits</p>${bullets(x.icp_fit?.reasons)}</div><div><p class="label">Watch out for</p>${bullets(x.risks)}</div></div></article>
    <article class="card"><div class="cols"><div><p class="label">Likely pains</p>${bullets(x.pains)}</div><div><p class="label">Ways in</p>${tracks || '<p class="meta">None.</p>'}</div></div></article>
    <article class="card"><p class="label">Signals (${(d.signals || []).length})</p>${sigList(d.signals, 5) || '<p class="meta">No public signals found.</p>'}</article>
    <article class="card" id="peoplebox"></article>
    <p class="foot">Saved to Accounts under <b>Looked up</b>. Public sources only. Nothing is sent to anyone.</p>`;
}

async function run(domain) {
  $("go").disabled = true;
  $("out").innerHTML = skeleton(3) + `<p class="meta" style="text-align:center">Collecting signals and writing the dossier. About 10 seconds.</p>`;
  try {
    const d = await api("research-account", { domain });
    $("out").innerHTML = dossierHtml(d);
    mountPeople($("peoplebox"), d.account.name, d.account.domain, false);
  } catch (e) { $("out").innerHTML = `<div class="card err">${esc(e.message)}</div>`; }
  finally { $("go").disabled = false; }
}
$("form").addEventListener("submit", (e) => { e.preventDefault(); const v = $("domain").value.trim(); if (v) run(v); });
document.querySelectorAll("[data-d]").forEach((el) => el.addEventListener("click", () => { $("domain").value = el.dataset.d; run(el.dataset.d); }));

/* ============ ICP & Signals playbook ============ */

</div>

          <div><b>People to contact</b>${p.personas.map((x) => `<div>${esc(x.title)}${x.note ? `<div class="meta">${esc(x.note)}</div>` : ""}</div>`).join("")}</div>

/* ============ Inbound: a lead arrives, the rep is alerted within a minute ============ */
let INB = null;
const LEAD_BADGE = { hot: "hot", warm: "warm", review: "accent", not_fit: "" };
const INTENT_LABEL = { demo: "Asked for a demo", pricing: "Asked about pricing", question: "Sent a question" };
const dur = (s) => (s == null ? "" : s < 90 ? `${s} sec` : s < 5400 ? `${Math.round(s / 60)} min` : `${(s / 3600).toFixed(1)} h`);

function leadForm() {
  return `<article class="card"><p class="label">Try it: send a lead</p>
    <p class="meta" style="margin:0 0 12px">This is the form a visitor on a client's site would fill in. Submit it and watch the rep get an email and a HubSpot to-do. Your details are stored for this demo and only the owner can see them.</p>
    <form class="leadform" id="leadform" autocomplete="off">
      <div class="row2"><input name="name" placeholder="Your name" aria-label="Your name" required maxlength="80"><input name="email" type="email" placeholder="Work email" aria-label="Work email" required maxlength="120"></div>
      <div class="row2"><input name="company" placeholder="Company (optional)" aria-label="Company" maxlength="80"><input name="role" placeholder="Your role (optional)" aria-label="Your role" maxlength="80"></div>
      <select name="intent" aria-label="What do you need"><option value="demo">I would like a demo</option><option value="pricing">I have a pricing question</option><option value="question">I have a question</option></select>
      <textarea name="message" placeholder="Anything we should know? (optional)" aria-label="Message" maxlength="1000"></textarea>
      <input class="hp" name="website" tabindex="-1" aria-hidden="true" autocomplete="off">
      <div class="actions" style="margin:0"><button class="btn primary" id="leadgo" type="submit">Send</button><span class="meta">Takes about 10 to 20 seconds while the system checks the company.</span></div>
    </form><div id="leadout" aria-live="polite"></div></article>`;
}

function leadCard(l, own, sla) {
  const waiting = l.status === "new" && l.label && l.label !== "not_fit";
  const mins = waiting && l.alerted_at ? Math.floor((Date.now() - Date.parse(l.alerted_at)) / 60000) : null;
  const state = l.status === "new" ? (waiting ? `<span class="wait${mins >= sla ? " late" : ""}">Waiting ${mins ?? 0} min</span>` : "")
    : `<span class="badge good">${l.status === "closed" ? "Closed" : l.status === "replied" ? "Replied" : "Contacted"}${l.response_seconds != null ? ` · ${dur(l.response_seconds)}` : ""}</span>`;
  const sigs = (l.signals || []).map((t) => `<li><span class="k hiring">Signal</span><span class="t">${esc(t)}</span><span class="when"></span></li>`).join("");
  return `<article class="card" data-lid="${esc(l.id)}">
    <div class="eyebrow"><span class="badge ${LEAD_BADGE[l.label] || ""}">${esc(INB.labels[l.label] || "Processing")}</span><span>${esc(INTENT_LABEL[l.intent])}</span><span>${esc(ago(l.created_at))}</span>${state}${l.account_id ? watchBtn("company", l.account_id, !!l.watched) : ""}</div>
    <h3 class="title">${esc(l.name)}${l.company ? ` <span class="sub" style="font-weight:400">· ${esc(l.company)}</span>` : ""}</h3>
    <div class="meta">${l.role ? `${esc(l.role)} · ` : ""}${own ? `<a href="mailto:${esc(l.email)}">${esc(l.email)}</a>` : esc(l.email)}</div>
    ${l.label !== "not_fit" ? fitLine(l.fit, l.facts) : ""}
    ${l.context ? `<div class="meta" style="margin-top:6px">${esc(l.context)}</div>` : ""}
    ${l.message ? `<div class="why">“${esc(l.message)}”</div>` : ""}
    ${l.why ? `<div class="why"><b>Why now.</b> ${esc(l.why)}</div>` : ""}
    ${sigs ? `<ul class="sigs">${sigs}</ul>` : ""}
    ${own && l.status !== "closed" ? `<div class="actions"><a class="btn primary" href="mailto:${esc(l.email)}">Reply</a>${l.status === "new" ? `<button class="btn ghost" data-resp="contacted">Mark contacted</button>` : ""}${l.status !== "replied" ? `<button class="btn ghost" data-resp="replied">They replied</button>` : ""}<button class="btn ghost" data-resp="closed">Close</button></div>` : ""}</article>`;
}

function drawInbound() {
  const d = INB, st = d.stats;
  const c = $("c-inbound"); c.textContent = st.waiting; c.hidden = !st.waiting;
  if (!$("leadformbox")) $("inbody").innerHTML = `<div id="instats"></div><div id="leadformbox">${leadForm()}</div><div id="leadlist"></div>`; // the form is drawn once, so a result stays visible
  $("instats").innerHTML = `<div class="tiles"><div class="tile"><b>${esc(st.last_30d)}</b><span>leads in 30 days</span></div>
      <div class="tile"><b style="color:${st.waiting ? "var(--warn)" : "inherit"}">${esc(st.waiting)}</b><span>waiting for a reply</span></div>
      <div class="tile"><b>${st.median_response_seconds == null ? "–" : esc(dur(st.median_response_seconds))}</b><span>median time to reply (target ${esc(d.sla_minutes)} min)</span></div></div>
      ${st.by_source?.length ? `<p class="meta" style="margin:-4px 0 0">By source, 30 days: ${st.by_source.map((x) => `${esc(x.name)} ${esc(x.count)}`).join(" · ")}</p>` : ""}`;
  $("leadlist").innerHTML = d.leads.length ? `<p class="label" style="margin:22px 0 10px">Leads</p>${d.leads.map((l) => leadCard(l, d.admin, d.sla_minutes)).join("")}` : `<div class="card empty">No leads yet. Send one above.</div>`;
}

async function loadInbound(quiet) {
  if (!quiet) $("inbody").innerHTML = skeleton(4);
  try { INB = await api("inbound", { action: "list" }); drawInbound(); }
  catch (e) { $("inbody").innerHTML = `<div class="card err">${esc(e.message)}</div>`; }
}

$("inbody").addEventListener("submit", async (e) => {
  if (e.target.id !== "leadform") return;
  e.preventDefault();
  const f = e.target, btn = $("leadgo"), out = $("leadout"), data = Object.fromEntries(new FormData(f));
  btn.disabled = true; out.innerHTML = `<p class="meta" style="margin-top:14px">Checking the company, its fit and any buying signals…</p>`;
  const t0 = Date.now();
  try {
    const q = new URLSearchParams(location.search), ctx = { utm_source: q.get("utm_source"), utm_medium: q.get("utm_medium"), utm_campaign: q.get("utm_campaign"), referrer: document.referrer, page: location.pathname };
    const r = await api("inbound", { ...data, ...ctx, source: "demo form" });
    const total = ((Date.now() - t0) / 1000).toFixed(1);
    out.innerHTML = `<p class="label" style="margin:16px 0 0">${r.duplicate ? "Already received today" : "What just happened"} · ${esc(total)} s in total</p>
      <ol class="steps">${(r.timeline || []).map((s) => `<li><span class="t">${(s.ms / 1000).toFixed(1)}s</span><span><b>${esc(s.step)}.</b> ${esc(s.detail)}</span></li>`).join("")}</ol>
      <p class="meta" style="margin:10px 0 0">Routed as <b>${esc(r.label_text)}</b>. Nothing was sent to you; the rep was alerted.</p>`;
    f.reset(); loadInbound(true).then(() => {});
  } catch (err) { out.innerHTML = `<p class="err" style="margin-top:12px">${esc(err.message)}</p>`; }
  btn.disabled = false;
});

$("inbody").addEventListener("click", async (e) => {
  const b = e.target.closest("[data-resp]"); if (!b) return;
  const id = b.closest("[data-lid]").dataset.lid; b.disabled = true;
  try {
    const r = await api("inbound", { action: "respond", lead_id: id, kind: b.dataset.resp });
    if (r.mode === "dry_run") { say(r.message); b.disabled = false; return; }
    say({ contacted: "Marked contacted. Follow-ups are scheduled.", replied: "Marked as replied.", closed: "Closed." }[b.dataset.resp]); loadInbound(true);
  } catch (err) { say(err.message); b.disabled = false; }
});

/* ============ Meetings: briefs before, debriefs after ============ */
let MT = null, sigPending = null; const picked = {};
const OUT_LABEL = { went_well: "Went well", follow_up: "Needs a follow-up", no_show: "No-show", not_fit: "Not a fit" };
const OUT_BADGE = { went_well: "good", follow_up: "accent", no_show: "warn", not_fit: "" };
const when = (iso) => new Date(iso).toLocaleString(undefined, { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });

function crmLine(m) {
  const a = m.crm?.actions;
  if (a?.length) return `<p class="meta" style="margin:10px 0 0"><b>HubSpot updated:</b> ${esc(a.join(" · "))}</p>`;
  return m.crm ? `<p class="meta" style="margin:10px 0 0">${esc(m.crm.skipped || "Nothing to update in HubSpot.")}</p>` : "";
}
function recapBlock(m) {
  const r = m.recap; if (!r) return m.notes ? `<p class="meta" style="margin:10px 0 0">Notes: ${esc(m.notes)}</p>` : "";
  const ul = (t, a) => a?.length ? `<p class="label">${t}</p><ul class="plain">${a.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>` : "";
  return `<div class="recap panel"><p>${esc(r.summary)}</p>${ul("Pains", r.pains)}${ul("Objections", r.objections)}${ul("Next steps", r.next_steps)}
    ${r.follow_up?.body ? `<details><summary>Follow-up email draft</summary><pre><b>${esc(r.follow_up.subject)}</b>\n\n${esc(r.follow_up.body)}</pre><p class="meta" style="margin:8px 0 0">A starting point. Edit it and send it yourself; nothing is sent for you.</p></details>` : ""}</div>`;
}
const head = (m) => `<div class="card-head"><div><h3 class="title" style="margin-top:0">${esc(m.attendee)}${m.company ? ` <span class="sub" style="font-weight:400">· ${esc(m.company)}</span>` : ""}</h3>
  <div class="meta">${esc(m.title || "Meeting")} · ${esc(when(m.starts_at))}</div></div></div>`;

function mNeed(m) {
  const sel = picked[m.id];
  return `<article class="card" data-mid="${esc(m.id)}"><div class="eyebrow" style="margin-bottom:6px"><span class="badge warn">Needs your debrief</span>${m.in_hubspot ? `<span class="badge good">In HubSpot</span>` : ""}</div>${head(m)}
    <div class="chips" style="margin:14px 0 0">${Object.entries(OUT_LABEL).map(([k, l]) => `<button class="chip${sel === k ? " sel" : ""}" data-pick="${k}">${l}</button>`).join("")}</div>
    <textarea class="notes" data-notes placeholder="Optional: two lines on what you heard. Used for a recap and a follow-up email draft."></textarea>
    <div class="actions" style="margin-top:12px"><button class="btn primary" data-savedebrief>Save debrief</button><span class="meta">Updates HubSpot${m.in_hubspot ? "" : " (once the company is pushed)"}. Notes cost about 1 cent for the recap.</span></div></article>`;
}
function mUp(m) {
  return `<article class="card"><div class="eyebrow" style="margin-bottom:6px"><span class="badge accent">Upcoming</span>${m.moved_from ? `<span class="badge warn">Moved</span><span>was ${esc(when(m.moved_from))}</span>` : `<span>Brief emailed to you</span>`}</div>${head(m)}
    ${m.brief ? `<details><summary>View the brief</summary><pre class="draft" style="margin:6px 0 0">${esc(m.brief)}</pre></details>` : ""}</article>`;
}
function mCancelled(m) {
  return `<article class="card"><div class="eyebrow" style="margin-bottom:6px"><span class="badge warn">Cancelled</span><span>${esc(ago(m.cancelled_at))}</span></div>${head(m)}
    <p class="meta" style="margin:10px 0 0">No debrief needed. A to-do to reschedule was created in HubSpot${m.in_hubspot ? "" : " (once the company is pushed)"} and the account is back in Today for a follow-up.</p></article>`;
}
function mDone(m) {
  const addNotes = !m.recap && !m.notes ? `<details data-mid="${esc(m.id)}"><summary>Add notes for a recap</summary><textarea class="notes" data-notes placeholder="Two lines on what you heard."></textarea>
      <div class="actions" style="margin-top:10px"><button class="btn ghost sm" data-addnotes="${esc(m.outcome)}">Write recap</button></div></details>` : "";
  return `<article class="card"><div class="eyebrow" style="margin-bottom:6px"><span class="badge ${OUT_BADGE[m.outcome] || ""}">${esc(OUT_LABEL[m.outcome])}</span><span>${esc(ago(m.debriefed_at))}</span></div>${head(m)}${crmLine(m)}${recapBlock(m)}${addNotes}</article>`;
}

function drawMeetings() {
  const d = MT, sec = (t, list, fn) => list.length ? `<p class="label" style="margin:22px 0 10px">${t}</p>${list.map(fn).join("")}` : "";
  const c = $("c-meetings"); c.textContent = d.needs.length; c.hidden = !d.needs.length;
  $("meetbody").innerHTML = (sec("Needs a debrief", d.needs, mNeed) + sec("Upcoming", d.upcoming, mUp) + sec("Cancelled", d.cancelled || [], mCancelled) + sec("Done", d.done, mDone)).replace(/^<p class="label" style="margin:22px 0 10px">/, '<p class="label" style="margin:0 0 10px">')

async function saveDebrief(mid, outcome, notes, btn) {
  if (btn) btn.disabled = true; say(notes ? "Saving and writing the recap…" : "Saving…");
  try {
    const sig = sigPending && sigPending.id === mid && sigPending.outcome === outcome ? sigPending.sig : undefined;
    const r = await api("queue", { action: "debrief", meeting_id: mid, outcome, notes: notes || undefined, sig });
    if (r.mode === "dry_run") { say(r.message); if (btn) btn.disabled = false; return false; }
    say(`Saved: ${OUT_LABEL[outcome]}.${r.crm?.actions?.length ? " HubSpot updated." : ""}`);
    delete picked[mid]; await loadMeetings(true); return true;
  } catch (err) { say(err.message); if (btn) btn.disabled = false; return false; }
}

$("meetbody").addEventListener("click", async (e) => {
  const card = e.target.closest("[data-mid]"); if (!card) return;
  const mid = card.dataset.mid;
  const pick = e.target.closest("[data-pick]");
  if (pick) { picked[mid] = pick.dataset.pick; card.querySelectorAll("[data-pick]").forEach((b) => b.classList.toggle("sel", b === pick)); return; }
  const notes = card.querySelector("[data-notes]")?.value.trim() || "";
  if (e.target.closest("[data-savedebrief]")) {
    if (!picked[mid]) { say("Pick how it went first."); return; }
    await saveDebrief(mid, picked[mid], notes, e.target.closest("button"));
  }
  const add = e.target.closest("[data-addnotes]");
  if (add) { if (!notes) { say("Write a line or two first."); return; } await saveDebrief(mid, add.dataset.addnotes, notes, add); }
});

async function handleLossLink() {
  const m = /^#loss=([0-9a-f-]+)&r=([a-z_]+)&s=([0-9a-f]+)$/.exec(location.hash); if (!m) return false;
  history.replaceState(null, "", location.pathname);

    say(r.mode === "dry_run" ? r.message : `Recorded: ${r.label}.${r.hubspot ? " HubSpot deal updated." : ""}`);
    if (r.mode !== "dry_run") ACC = null;
  } catch (err) { say(err.message); }
  return true;
}

async function handleDebriefLink() {
  const m = /^#debrief=([0-9a-f-]+)&o=([a-z_]+)&s=([0-9a-f]+)$/.exec(location.hash); if (!m) return false;
  history.replaceState(null, "", location.pathname);

  sigPending = { id, outcome, sig };

  return true;
}

/* ============ custom dropdowns: every <select> gets our own list (the browser's looks different on every system) ============ */
let DD_OPEN = null;
function ddClose() { if (!DD_OPEN) return; DD_OPEN.list.hidden = true; DD_OPEN.btn.setAttribute("aria-expanded", "false"); DD_OPEN = null; }
function enhanceSelect(sel) {
  if (sel.dataset.dd) return; sel.dataset.dd = "1";
  const wrap = document.createElement("span"); wrap.className = "dd";
  sel.parentNode.insertBefore(wrap, sel); wrap.append(sel);
  const btn = document.createElement("button"); btn.type = "button"; btn.className = `dd-btn${sel.classList.contains("set") ? " set" : ""}`;
  btn.setAttribute("aria-haspopup", "listbox"); btn.setAttribute("aria-expanded", "false");
  const lab = sel.getAttribute("aria-label") || (sel.id && document.querySelector(`label[for="${sel.id}"]`)?.textContent); if (lab) btn.setAttribute("aria-label", lab);
  const list = document.createElement("div"); list.className = "dd-list"; list.setAttribute("role", "listbox"); list.hidden = true;
  wrap.append(btn, list);
  let act = 0;
  const text = () => sel.options[sel.selectedIndex]?.text ?? "";
  const paint = () => { btn.textContent = text(); [...list.children].forEach((o, i) => { o.setAttribute("aria-selected", String(i === sel.selectedIndex)); o.classList.toggle("act", i === act); }); };
  const open = () => {
    ddClose(); list.innerHTML = "";
    [...sel.options].forEach((o, i) => { const d = document.createElement("div"); d.className = "dd-opt"; d.setAttribute("role", "option"); d.textContent = o.text; d.dataset.i = i; list.append(d); });
    act = Math.max(0, sel.selectedIndex); list.hidden = false; btn.setAttribute("aria-expanded", "true"); DD_OPEN = { btn, list }; paint();
    list.children[act]?.scrollIntoView({ block: "nearest" });
  };
  const pick = (i) => { sel.selectedIndex = i; sel.dispatchEvent(new Event("change", { bubbles: true })); ddClose(); btn.focus(); paint(); };
  btn.addEventListener("click", () => (list.hidden ? open() : ddClose()));
  list.addEventListener("click", (e) => { const o = e.target.closest(".dd-opt"); if (o) pick(Number(o.dataset.i)); });
  btn.addEventListener("keydown", (e) => {
    const n = sel.options.length;
    if (["ArrowDown", "ArrowUp", "Enter", " "].includes(e.key)) {
      e.preventDefault();
      if (list.hidden) { open(); return; }
      if (e.key === "ArrowDown") act = Math.min(n - 1, act + 1); else if (e.key === "ArrowUp") act = Math.max(0, act - 1); else { pick(act); return; }
      paint(); list.children[act]?.scrollIntoView({ block: "nearest" });
    } else if (e.key === "Escape" || e.key === "Tab") ddClose();
  });
  paint();
}
const enhanceAll = (root = document) => root.querySelectorAll?.("select:not([data-dd])").forEach(enhanceSelect);
document.addEventListener("click", (e) => { if (DD_OPEN && !e.target.closest(".dd")) ddClose(); });
new MutationObserver((muts) => { for (const m of muts) for (const n of m.addedNodes) if (n.nodeType === 1) { if (n.matches?.("select")) enhanceSelect(n); else enhanceAll(n); } }).observe(document.body, { childList: true, subtree: true });
enhanceAll();

/** Shrinks a chosen picture to at most 256 pixels and returns it as a small PNG data URL (SVG is kept as is, if small). */
function logoFromFile(file) {
  return new Promise((resolve, reject) => {
    if (!/^image\/(png|jpeg|webp|svg\+xml)$/.test(file.type)) return reject(new Error("Use a PNG, JPG, WebP or SVG picture."));
    const r = new FileReader();
    r.onerror = () => reject(new Error("Could not read that file."));
    r.onload = () => {
      if (file.type === "image/svg+xml") return r.result.length <= 200000 ? resolve(r.result) : reject(new Error("That SVG is too big (200 KB at most)."));
      const img = new Image();
      img.onerror = () => reject(new Error("That picture could not be opened."));
      img.onload = () => {
        const k = Math.min(1, 256 / Math.max(img.width, img.height)), c = document.createElement("canvas");
        c.width = Math.max(1, Math.round(img.width * k)); c.height = Math.max(1, Math.round(img.height * k));
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); resolve(c.toDataURL("image/png"));
      };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

    <div class="fbar"><span>Showing <b>${list.length}</b> of ${d.people.length} saved people${co ? ` at <b>${esc(co)}</b> <a href="#/people">(all companies)</a>` : ""}</span>
      <span class="acts">${(PF.lead || PF.persona || PF.email || PF.hub || PF.q) ? `<button class="btn link sm" data-pclear>Clear filters</button>` : ""}${own && d.people.length ? `<button class="btn ghost sm" data-bulkai title="The AI judges each lead from everything we know">Score with AI</button><button class="btn ghost sm" data-pexport title="Downloads this list as a spreadsheet file. Only emails you have revealed are included">Export (.csv)</button>` : ""}</span></div></div>`;
  const row = (p) => `<div class="wrow" data-pid="${esc(p.id)}"><div class="wmain"><b>${esc(p.name)}</b> <span class="badge ${LEAD[p.lead.label][0]}" title="${p.lead.ai ? "Judged by the AI. " : ""}Lead score ${p.lead.score} of 100">${LEAD[p.lead.label][1]}${p.lead.ai ? " · AI" : ""}</span> <span class="badge">${esc(BUYER[p.lead.buyer])}</span> <span class="meta">${esc(p.title)} at <a class="clink" href="#/company/${esc(p.account_id)}">${esc(p.company)}</a></span>
      <div class="meta">${p.persona ? `<span class="ptag">${esc(p.persona)}</span> ` : `<span class="meta">Not one of your buyer types</span> `}${p.revealed ? `<b>${esc(p.email)}</b>${p.email_status ? ` <span class="pill ${(STATUS[p.email_status] || [0, ""])[1]}">${esc((STATUS[p.email_status] || ["Unverified"])[0])}</span>` : ""}` : p.has_email ? "email found, not revealed" : "no email"}${p.in_hubspot ? ` · <span class="pill ok">In HubSpot</span>` : ""}${p.hs_status === "opted_out" ? ` · <span class="pill bad">Opted out</span>` : p.hs_status === "bounced" ? ` · <span class="pill bad">Bounced</span>` : p.hs_status === "known" ? ` · <span class="pill warn" title="${esc(p.hs_note || "")}">Already in your HubSpot</span>` : ""}${p.manual ? " · added by you" : ""} · saved ${esc(day(p.added))}</div><div class="meta" style="margin-top:3px">Why: ${esc(p.lead.reasons.slice(0, 4).join(" · "))}</div></div>
      <div class="wside">${own && p.has_email && !p.revealed && !["opted_out", "bounced"].includes(p.hs_status) ? `<button class="btn ghost sm" data-penrich>Enrich</button>` : ""}${watchBtn("person", p.id, p.watched)}</div></div>`;
  const nobody = !PF.company && !PF.persona && !PF.email && !PF.hub && !q && d.nobody.length
    ? `<article class="card"><p class="label">Searched, nobody found (${d.nobody.length})</p><p class="help" style="margin:0 0 6px">These companies were searched. No need to search them again for a while.</p>${d.nobody.slice(0, 30).map((n) => `<div class="wrow"><div class="wmain"><b><a class="clink" href="#/company/${esc(n.id)}">${esc(n.name)}</a></b> <span class="meta">${esc(n.domain)} · searched ${esc(day(n.at))}${n.by === "auto" ? " (automatic)" : ""}</span></div></div>`).join("")}</article>` : "";
  $("plist").innerHTML = (list.length ? `<article class="card">${list.map(row).join("")}</article>` : `<div class="card empty">${d.people.length ? "No people match these filters." : "No people saved yet. Use <b>Find people</b> on a company in Accounts and everyone found is kept here, enriched or not."}${d.people.length ? "" : `<div class="actions" style="justify-content:center;margin-top:12px"><a class="btn ghost sm" href="#/accounts">Open Accounts</a></div>`}</div>`) + nobody;
  const s = $("psearch"); if (PF.q && document.activeElement?.id === "psearch") { s.focus(); s.setSelectionRange(PF.q.length, PF.q.length); }
}
$("phead").addEventListener("input", (e) => { if (e.target.id === "psearch") { PF.q = e.target.value; drawPeople(); const s = $("psearch"); s.focus(); s.setSelectionRange(PF.q.length, PF.q.length); } });
$("phead").addEventListener("change", (e) => { const k = e.target.dataset?.pf; if (k) { PF[k] = e.target.value; drawPeople(); } });
$("phead").addEventListener("click", (e) => {
  if (e.target.closest("[data-pclear]")) { PF = { q: "", lead: "", persona: "", email: "", hub: "", company: PF.company }; drawPeople(); return; }
  if (e.target.closest("[data-bulkai]")) { runBulkAi(e.target.closest("button")); return; }
  if (e.target.closest("[data-pexport]")) {
    const cell = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
    const rows = [["Name", "Title", "Company", "Website", "Lead", "Score", "Buyer type", "Email (revealed only)", "In HubSpot", "Saved"], ...PPL.people.map((p) => [p.name, p.title, p.company, p.domain, p.lead.label, p.lead.score, p.persona || "", p.email || "", p.in_hubspot ? "yes" : "no", (p.added || "").slice(0, 10)])];
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([rows.map((r) => r.map(cell).join(",")).join("\n")], { type: "text/csv" })); a.download = "f1rstword-people.csv"; a.click(); URL.revokeObjectURL(a.href);
    say("Exported. Only emails you have revealed are included.");
  }
});
$("plist").addEventListener("click", async (e) => {
  const b = e.target.closest("[data-penrich]"); if (!b) return;
  const id = b.closest("[data-pid]").dataset.pid; b.disabled = true;
  try { const r = await api("people", { action: "enrich", person_id: id, what: "email" }); if (r.mode === "dry_run") { say(r.message); b.disabled = false; return; } say("Email revealed."); loadPeople(true); }
  catch (err) { say(err.message); b.disabled = false; }
});

/* ============ navigation: every view has its own address, so Back, bookmarks and email links work ============ */
const SECTIONS = ["today", "accounts", "people", "company", "research", "watchlist", "conversations", "setup"];
const NAV_OF = { today: "today", accounts: "accounts", people: "accounts", company: "accounts", research: "accounts", watchlist: "watchlist", conversations: "conversations", setup: "setup" };
let CUR = { view: "today" }, CO = null, PENDING_CLICK = null;
function parseRoute(h = location.hash) {
  const [v, a] = h.replace(/^#\/?/, "").split("?")[0].split("/");
  if (v === "inbound") return { view: "conversations", sub: "leads" };
  if (v === "meetings") return { view: "conversations", sub: "meetings" };
  if (v === "company" && a) return { view: "company", id: a };
  if (v === "people") return { view: "people", id: a || null };
  if (v === "conversations") return { view: v, sub: a === "meetings" ? "meetings" : "leads" };
  if (v === "setup") return { view: v, sub: a || null };
  if (["today", "accounts", "watchlist", "research"].includes(v)) return { view: v };
  return { view: "today" };
}
const routeHash = (r) => r.view === "company" ? `#/company/${r.id}` : r.view === "people" ? (r.id ? `#/people/${r.id}` : "#/people") : r.view === "conversations" ? `#/conversations/${r.sub === "meetings" ? "meetings" : "leads"}` : r.view === "setup" ? (r.sub ? `#/setup/${r.sub}` : "#/setup") : `#/${r.view}`;
let lastView = null;
function showView(r, { push = true, force = false } = {}) {
  const view = SECTIONS.includes(r.view) ? r.view : "today";
  const next = { ...r, view };
  const sameSetup = view === "setup" && lastView === "setup" && !force; // moving between Setup sections does not reload it
  CUR = next;
  document.querySelectorAll("nav.tabs [data-tab]").forEach((x) => x.setAttribute("aria-selected", String(x.dataset.tab === NAV_OF[view])));
  for (const t of SECTIONS) $(t).hidden = t !== view;
  const h = routeHash(next);
  if (location.hash !== h) (push ? history.pushState : history.replaceState).call(history, null, "", h);
  if (lastView !== view || force) window.scrollTo(0, 0);
  lastView = view;
  if (view === "conversations") {
    const sub = next.sub === "meetings" ? "meetings" : "leads";
    $("inbound").hidden = sub !== "leads"; $("meetings").hidden = sub !== "meetings";
    document.querySelectorAll("#convseg [data-csub]").forEach((x) => { x.classList.toggle("on", x.dataset.csub === sub); x.setAttribute("aria-selected", String(x.dataset.csub === sub)); });
    (sub === "leads" ? loadInbound : loadMeetings)();
  } else if (view === "company") loadCompany(next.id);
  else if (view === "setup") { if (sameSetup && SETUP) applySetupSection(); else loadSetup(); }
  else if (view === "people") { PF.company = next.id || null; loadPeople(); }
  else if (view === "research") { if (next.domain) { $("domain").value = next.domain; run(next.domain); } }
  else ({ today: loadToday, accounts: loadAccounts, watchlist: loadWatchlist }[view] || (() => {}))();
}
document.querySelectorAll("nav.tabs [data-tab]").forEach((b) => b.addEventListener("click", () => showView({ view: b.dataset.tab, sub: b.dataset.tab === "conversations" ? CUR.sub : null })));
document.querySelectorAll("#convseg [data-csub]").forEach((b) => b.addEventListener("click", () => showView({ view: "conversations", sub: b.dataset.csub })));
window.addEventListener("hashchange", () => { if (/^#(debrief|loss)=/.test(location.hash)) return; const r = parseRoute(); if (routeHash(r) !== routeHash(CUR) || r.view !== CUR.view) showView(r, { push: false }); });
// "Check size", "Find people" and similar actions can be started from other views: go there, then press the button once it exists.
document.addEventListener("click", (e) => {
  const d = e.target.closest("[data-do]"); if (!d) return;
  const what = d.dataset.do;
  if (what === "bulkfind" || what === "bulkfacts") { PENDING_CLICK = what === "bulkfind" ? "[data-bulkfind]" : "[data-bulkfacts]"; showView({ view: "accounts" }); }
  else if (what === "discover") showView({ view: "setup", sub: "find" });
  else if (what === "follow") { WLV = "companies"; showView({ view: "watchlist" }); setTimeout(() => { const f = document.querySelector("#wlbody details.fdet"); if (f) { f.open = true; $("wlsite")?.focus(); } }, 700); }
});
// Counts for the two parts of Conversations add up on the tab.
new MutationObserver(() => { const n = Number($("c-inbound").textContent || 0) * ($("c-inbound").hidden ? 0 : 1) + Number($("c-meetings").textContent || 0) * ($("c-meetings").hidden ? 0 : 1); $("c-conv").textContent = n; $("c-conv").hidden = !n; }).observe($("convseg"), { subtree: true, childList: true, attributes: true, characterData: true });

/* ============ one company on one page ============ */
async function loadCompany(id, quiet) {
  if (!quiet) $("cobody").innerHTML = skeleton(4);
  try { CO = await api("queue", { action: "company", account_id: id }); if (CO.error) throw new Error(CO.error); drawCompany(); }
  catch (e) { $("cobody").innerHTML = `<p style="margin:0 0 12px"><a href="#/accounts">← Accounts</a></p><div class="card err">${esc(e.message)}</div>`; }
}
function drawCompany() {
  const d = CO, a = d.account;
  const hist = d.history.map((h) => `<div class="wev"><span class="dot"></span><div><div class="wt">${esc(String(h.kind).replace(/_/g, " "))}${h.note ? `: ${esc(h.note)}` : ""}</div><div class="wm">${esc(ago(h.at))}</div></div></div>`).join("");
  const ev = d.events.map((e) => `<div class="wev"><span class="dot"></span><div><div class="wt"><span class="badge ${e.importance === "big" ? "accent" : ""}">${esc(String(e.kind).replace(/_/g, " "))}</span> ${e.url ? `<a href="${esc(e.url)}" target="_blank" rel="noopener noreferrer">${esc(e.title)}</a>` : esc(e.title)}</div><div class="wm">${esc(ago(e.detected_at))}</div></div></div>`).join("");
  const mt = d.meetings.map((m) => `<div class="wev"><span class="dot"></span><div><div class="wt">${esc(m.title || "Meeting")}${m.outcome ? ` · ${esc(String(m.outcome).replace(/_/g, " "))}` : ""}</div><div class="wm">${esc(day(m.starts_at))}</div></div></div>`).join("");
  $("cobody").innerHTML = `<p style="margin:0 0 12px"><a href="#/accounts" data-back>← Accounts</a></p>${aCard({ ...a, signals: d.signals.slice(0, 3) })}
    ${d.signals.length > 3 ? `<article class="card"><p class="label">Earlier signals</p>${sigList(d.signals.slice(3), 25)}</article>` : ""}
    <article class="card"><p class="label">People (${d.people.length})</p>${d.people.length ? d.people.map((p) => `<div class="wrow"><div class="wmain"><b>${esc(p.name)}</b> <span class="badge ${LEAD[p.lead.label][0]}">${LEAD[p.lead.label][1]}</span> <span class="meta">${esc(p.title)}</span><div class="meta">${p.persona ? `<span class="ptag">${esc(p.persona)}</span> ` : ""}${p.revealed ? `<b>${esc(p.email)}</b>` : p.has_email ? "email found, not revealed" : "no email"}${p.in_hubspot ? ` · <span class="pill ok">In HubSpot</span>` : ""}</div></div><div class="wside">${watchBtn("person", p.id, p.watched)}</div></div>`).join("") : `<p class="meta" style="margin:0">${a.searched_at ? `Searched ${esc(day(a.searched_at))}: nobody found.` : "Nobody saved yet. Use Find people above."}</p>`}</article>
    ${d.drafts.length ? `<article class="card"><p class="label">Drafts (suggestions, never sent)</p>${d.drafts.map((x) => `<div class="draft"><b>${esc(x.subject)}</b>\n\n${esc(x.body)}</div><p class="meta" style="margin:6px 0 12px">${x.persona ? `For ${esc(x.persona)} · ` : ""}${esc(day(x.created_at))}</p>`).join("")}</article>` : ""}
    ${ev ? `<article class="card"><p class="label">What moved (Watchlist)</p>${ev}</article>` : ""}
    ${hist ? `<article class="card"><p class="label">History</p>${hist}</article>` : ""}
    ${mt ? `<article class="card"><p class="label">Meetings</p>${mt}</article>` : ""}
    <p class="foot">${d.hubspot_url ? `<a href="${esc(d.hubspot_url)}" target="_blank" rel="noopener noreferrer">Open in HubSpot</a> · ` : ""}<a href="https://${esc(a.domain)}" target="_blank" rel="noopener noreferrer">${esc(a.domain)}</a> · <a href="#/research" data-research="${esc(a.domain)}">Write a dossier</a></p>`;
}
wireCards($("cobody"), () => loadCompany(CUR.id, true));
$("cobody").addEventListener("click", (e) => { const r = e.target.closest("[data-research]"); if (r) { e.preventDefault(); showView({ view: "research", domain: r.dataset.research }); } });

/* ============ search and jump (Ctrl or Cmd + K) ============ */
const PAL_PAGES = [["Today", { view: "today" }], ["Accounts", { view: "accounts" }], ["Watchlist", { view: "watchlist" }], ["Inbound leads", { view: "conversations", sub: "leads" }], ["Meetings", { view: "conversations", sub: "meetings" }], ["People (everyone searched)", { view: "people" }],
  ["Research a company", { view: "research" }], ["Setup: what you sell", { view: "setup", sub: "sell" }], ["Setup: who we look for", { view: "setup", sub: "look" }], ["Setup: who we contact", { view: "setup", sub: "contact" }], ["Setup: signals", { view: "setup", sub: "signals" }],
  ["Setup: alerts and email", { view: "setup", sub: "alerts" }], ["Setup: finding companies and credits", { view: "setup", sub: "find" }], ["Setup: HubSpot, name and health", { view: "setup", sub: "conn" }]];
const PAL_ACTIONS = [["Check size and stage for companies without it", () => { PENDING_CLICK = "[data-bulkfacts]"; showView({ view: "accounts" }); }], ["Find people for the top companies", () => { PENDING_CLICK = "[data-bulkfind]"; showView({ view: "accounts" }); }],
  ["Follow a company", () => { WLV = "companies"; showView({ view: "watchlist" }); setTimeout(() => { const f = document.querySelector("#wlbody details.fdet"); if (f) { f.open = true; $("wlsite")?.focus(); } }, 700); }], ["Find new companies (run discovery)", () => showView({ view: "setup", sub: "find" })]];
async function openPalette() {
  if ($("pal")) return;
  const bg = document.createElement("div"); bg.className = "pal-bg"; bg.id = "pal";
  bg.innerHTML = `<div class="pal" role="dialog" aria-modal="true" aria-label="Search"><input id="palq" type="text" placeholder="Search a company or person, or jump to a page or action…" autocomplete="off" spellcheck="false" aria-label="Search"><div class="pal-list" id="pall"></div></div>`;
  document.body.append(bg); const q = $("palq"); q.focus();
  if (!ACC?.accounts) api("queue", { action: "accounts" }).then((d) => { ACC = d; render(); }).catch(() => {});
  let items = [], act = 0;
  const close = () => { bg.remove(); document.removeEventListener("keydown", key, true); };
  const match = (text, words) => words.every((w) => text.toLowerCase().includes(w));
  function render() {
    const words = q.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
    const out = [];
    const pages = PAL_PAGES.filter(([t]) => match(t, words)).slice(0, words.length ? 5 : 6).map(([t, r]) => ({ sec: "Go to", t, go: () => showView(r) }));
    const acts = PAL_ACTIONS.filter(([t]) => match(t, words)).slice(0, 3).map(([t, f]) => ({ sec: "Do", t, go: f }));
    const cos = words.length ? (ACC?.accounts || []).filter((a) => !a.removed && match(`${a.name} ${a.domain} ${a.segment || ""}`, words)).slice(0, 6).map((a) => ({ sec: "Companies", t: a.name, small: a.domain, go: () => showView({ view: "company", id: a.id }) })) : [];
    const ppl = words.length ? (ACC?.accounts || []).flatMap((a) => (a.contacts || []).map((c) => ({ a, c }))).filter(({ a, c }) => match(`${c.name} ${c.title} ${a.name}`, words)).slice(0, 4).map(({ a, c }) => ({ sec: "People", t: c.name, small: `${c.title} at ${a.name}`, go: () => showView({ view: "people", id: a.id }) })) : [];
    const dom = /^[a-z0-9-]+(\.[a-z0-9-]+)+$/i.test(q.value.trim()) ? [{ sec: "Research", t: `Research ${q.value.trim().toLowerCase()}`, go: () => showView({ view: "research", domain: q.value.trim().toLowerCase() }) }] : [];
    items = [...cos, ...ppl, ...dom, ...pages, ...acts];
    act = Math.min(act, Math.max(0, items.length - 1));
    let last = "";
    $("pall").innerHTML = items.length ? items.map((it, i) => `${it.sec !== last ? `<div class="pal-sec">${esc((last = it.sec))}</div>` : ""}<div class="pal-opt${i === act ? " act" : ""}" data-i="${i}"><span>${esc(it.t)}</span>${it.small ? `<small>${esc(it.small)}</small>` : ""}</div>`).join("") : `<div class="pal-sec">Nothing matches</div>`;
  }
  const run = (i) => { const it = items[i]; if (!it) return; close(); it.go(); };
  function key(e) {
    if (e.key === "Escape") { e.preventDefault(); close(); }
    else if (e.key === "ArrowDown") { e.preventDefault(); act = Math.min(items.length - 1, act + 1); render(); document.querySelector(".pal-opt.act")?.scrollIntoView({ block: "nearest" }); }
    else if (e.key === "ArrowUp") { e.preventDefault(); act = Math.max(0, act - 1); render(); document.querySelector(".pal-opt.act")?.scrollIntoView({ block: "nearest" }); }
    else if (e.key === "Enter") { e.preventDefault(); run(act); }
  }
  document.addEventListener("keydown", key, true);
  q.addEventListener("input", () => { act = 0; render(); });
  bg.addEventListener("click", (e) => { if (e.target === bg) close(); const o = e.target.closest(".pal-opt"); if (o) run(Number(o.dataset.i)); });
  render();
}
$("kbar").addEventListener("click", openPalette);
document.addEventListener("keydown", (e) => {
  const typing = /^(input|textarea|select)$/i.test(e.target.tagName) || e.target.isContentEditable;
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); openPalette(); }
  else if (e.key === "/" && !typing && !$("pal")) { e.preventDefault(); openPalette(); }
});

drawMode(false);
refreshMode();

api("queue", { action: "watchlist" }).then((d) => { const c = $("c-watchlist"); c.textContent = d.unseen; c.hidden = !d.unseen; }).catch(() => {});
handleLossLink().then((lost) => lost || handleDebriefLink()).then((handled) => { if (!handled) showView(parseRoute(), { push: false }); if (!handled) api("queue", { action: "meetings" }).then((d) => { MT = d; const c = $("c-meetings"); c.textContent = d.needs.length; c.hidden = !d.needs.length; }).catch(() => {}); });
api("inbound", { action: "list" }).then((d) => { const c = $("c-inbound"); c.textContent = d.stats.waiting; c.hidden = !d.stats.waiting; }).catch(() => {});
api("queue", { action: "accounts" }).then((d) => { ACC = d; const c = $("c-accounts"), n = d.accounts.filter((a) => !a.low && a.outreach_status === "open").length; c.textContent = n; c.hidden = !n; }).catch(() => {});
</script>
